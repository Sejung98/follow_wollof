<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 14'%3E%3Ccircle cx='4' cy='7' r='3' fill='%236d6af0'/%3E%3Ccircle cx='11' cy='7' r='3' fill='%236d6af0'/%3E%3Ccircle cx='18' cy='7' r='3' fill='%230ea271'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
  try { const t = localStorage.getItem("fw-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #17171a; --ink2: #3f3f46; --muted: #8a8a93; --faint: #c4c4c9;
  --line: #ececea; --soft: #f0f0ed; --grid: #e7e7e3;
  --done: #6d6af0; --now: #0ea271; --now-bg: #eaf8f2; --blocked: #e5484d; --blocked-bg: #fdeeee;
  --derive: #e5902b; --edge: #dcdcd7; --node: #ffffff; --shine: #ffffff;
  --done-line: #c9c8f6; --done-tint: #eeeefd; --done-flash: #dcdbfc; --walk: #bdbbf4; --now-edge: #a9ddc8; --now-track: #c6ecdc;
  --glow: rgba(14,162,113,.28); --shadow: 0 1px 2px rgba(17,17,26,.04), 0 12px 32px -18px rgba(17,17,26,.16);
  --ease: cubic-bezier(.22,1,.36,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0c0f; --panel: #141418; --ink: #f0f0f3; --ink2: #c9c9d1; --muted: #85858f; --faint: #45454e;
    --line: #1f1f25; --soft: #1b1b20; --grid: #1c1c22;
    --done: #9b98ff; --now: #34d399; --now-bg: #0f2a20; --blocked: #ff6b6f; --blocked-bg: #33171a;
    --derive: #f5a74b; --edge: #2c2c34; --node: #18181d; --shine: #b8ffe3;
  --done-line: #3e3c78; --done-tint: #232248; --done-flash: #2f2d63; --walk: #4f4d9c; --now-edge: #1f5a45; --now-track: #1d4a3a;
    --done-line: #3e3c78; --done-tint: #232248; --done-flash: #2f2d63; --walk: #4f4d9c; --now-edge: #1f5a45; --now-track: #1d4a3a;
    --glow: rgba(52,211,153,.35); --shadow: 0 0 0 1px rgba(255,255,255,.015), 0 16px 40px -24px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0c0f; --panel: #141418; --ink: #f0f0f3; --ink2: #c9c9d1; --muted: #85858f; --faint: #45454e;
  --line: #1f1f25; --soft: #1b1b20; --grid: #1c1c22;
  --done: #9b98ff; --now: #34d399; --now-bg: #0f2a20; --blocked: #ff6b6f; --blocked-bg: #33171a;
  --derive: #f5a74b; --edge: #2c2c34; --node: #18181d; --shine: #b8ffe3;
  --done-line: #3e3c78; --done-tint: #232248; --done-flash: #2f2d63; --walk: #4f4d9c; --now-edge: #1f5a45; --now-track: #1d4a3a;
  --glow: rgba(52,211,153,.35); --shadow: 0 0 0 1px rgba(255,255,255,.015), 0 16px 40px -24px rgba(0,0,0,.8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
  font: 14px/1.5 "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 0; letter-spacing: -.005em;
  transition: background-color .5s var(--ease), color .5s var(--ease); }
.num { font-variant-numeric: tabular-nums; }

/* header */
header { display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 22px; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14.5px; letter-spacing: -.02em; }
.brand svg circle { transition: fill .5s; }
.brand .m1 { fill: var(--done); } .brand .m2 { fill: var(--now); } .brand .ml { stroke: var(--faint); }
.brand .m2 { animation: beat 2.4s var(--ease) infinite; transform-origin: 18px 7px; transform-box: view-box; }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
.summary { font-size: 12.5px; color: var(--muted); display: flex; gap: 14px; }
.summary b { color: var(--ink2); font-weight: 600; }
.spacer { flex: 1; }
.live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.theme { position: relative; display: flex; background: var(--soft); border-radius: 10px; padding: 3px; transition: background .5s; }
.theme .thumb { position: absolute; top: 3px; left: 3px; width: 30px; height: 26px; border-radius: 7px;
  background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.12); transition: transform .45s var(--ease), background .5s; }
.theme button { all: unset; position: relative; cursor: pointer; width: 30px; height: 26px; display: grid; place-items: center;
  color: var(--muted); transition: color .3s; }
.theme button:hover, .theme button.on { color: var(--ink); }
.theme svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* status dot */
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; position: relative; transition: background .4s; }
.dot.busy, .dot.on { background: var(--now); }
.dot.waiting { background: var(--derive); }
.dot.off { background: var(--blocked); }
.dot.busy::after, .dot.on::after, .dot.waiting::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: inherit; animation: ping 2.2s var(--ease) infinite; }
@keyframes ping { 0% { transform: scale(1); opacity: .6; } 70%, 100% { transform: scale(2.8); opacity: 0; } }

.wrap { flex: 1; display: flex; min-height: 0; }

/* sidebar */
aside { width: 264px; flex: none; overflow-y: auto; padding: 2px 10px 30px 14px; }
.host { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; color: var(--muted);
  letter-spacing: .07em; text-transform: uppercase; padding: 20px 10px 6px; }
.host .err { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--blocked);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; cursor: pointer;
  font-size: 13px; color: var(--muted); transition: background .25s var(--ease), color .25s; }
.item:hover { background: var(--soft); color: var(--ink); }
.item.sel { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.item.plan { color: var(--ink2); }
.item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .p { font-size: 11px; color: var(--muted); }
.item.all { font-weight: 650; color: var(--ink); margin-top: 2px; }
details summary { list-style: none; cursor: pointer; font-size: 11.5px; color: var(--muted); padding: 6px 10px; }
details summary::-webkit-details-marker { display: none; }

/* panels */
main { position: relative; flex: 1; overflow-y: auto; padding: 4px 26px 56px 12px; min-width: 0; display: flex; flex-direction: column; }
.panel, .empty { flex: none; }
.panel { position: relative; background: var(--panel); border-radius: 18px; box-shadow: var(--shadow);
  border: 1px solid var(--line); margin-bottom: 18px;
  animation: rise .7s var(--ease) both; transition: background-color .5s, border-color .5s, box-shadow .5s; }
.panel:hover { box-shadow: var(--shadow), 0 0 0 1px var(--line); }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.99); } }
.ph { display: flex; align-items: center; gap: 10px; padding: 16px 20px 0; cursor: pointer; user-select: none; -webkit-user-select: none; }
.grip { width: 14px; height: 20px; margin: 0 -4px 0 -10px; display: grid; place-items: center; color: var(--faint); cursor: grab;
  opacity: 0; transition: opacity .25s, color .25s; flex: none; }
.grip svg { width: 8px; height: 14px; fill: currentColor; }
.panel:hover .grip { opacity: 1; }
.grip:hover { color: var(--muted); }
.focus .grip { display: none; }
.panel.dragging { z-index: 10; transition: none !important; cursor: grabbing;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.35), 0 0 0 1px var(--line); }
.panel.dragging .grip { opacity: 1; color: var(--ink2); }
.panel.settling { transition: transform .4s var(--ease), box-shadow .4s var(--ease) !important; }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; }
body.is-dragging .tip { display: none; }
.reset-order { all: unset; cursor: pointer; font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 8px;
  background: var(--soft); transition: color .2s, background .2s; }
.reset-order:hover { color: var(--ink); }
.reset-order[hidden] { display: none; }
.demo-pill { font-size: 12px; font-weight: 600; color: var(--derive); background: var(--soft); padding: 4px 11px; border-radius: 999px;
  text-decoration: none; }
.demo-pill:hover { color: var(--ink); }
.panel-err { padding: 4px 20px 16px; font-size: 12px; color: var(--blocked); }
.ph .title { font-weight: 650; font-size: 15.5px; letter-spacing: -.02em; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph .hostname { font-size: 11.5px; color: var(--muted); background: var(--soft); padding: 1px 8px; border-radius: 6px; flex: none; }
.ph .meta { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: none; font-size: 12px; color: var(--muted); }
.ring { width: 22px; height: 22px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 2.6; }
.ring .bg { stroke: var(--soft); }
.ring .fg { stroke: var(--done); stroke-linecap: round; stroke-dasharray: 100; transition: stroke-dashoffset 1s var(--ease), stroke .5s; }
.panel.finished .ring .fg { stroke: var(--now); }
.cur { padding: 8px 20px 0; min-height: 30px; display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; padding: 3px 11px 3px 9px;
  border-radius: 999px; color: var(--now); background: var(--now-bg); animation: chipin .6s var(--ease) both; }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1.6s ease-in-out infinite; }
.chip.blocked { color: var(--blocked); background: var(--blocked-bg); }
.chip.finished { color: var(--done); background: var(--soft); }
.chip.finished i { animation: none; }
.chip.idle { color: var(--muted); background: var(--soft); font-weight: 500; }
.chip.idle i { display: none; }
@keyframes chipin { from { opacity: 0; transform: translateY(4px); filter: blur(3px); } }
@keyframes blink { 50% { opacity: .25; } }
.gbox { overflow-x: auto; padding: 12px 14px 16px; margin: 6px 8px 8px; border-radius: 12px; scrollbar-width: thin;
  background-image: radial-gradient(var(--grid) 1px, transparent 1.2px); background-size: 16px 16px; background-position: 4px 4px; }
.log { border-top: 1px solid var(--line); padding: 12px 20px 16px; font-size: 12.5px; color: var(--muted); }
.log div { display: flex; gap: 12px; padding: 4px 0; animation: chipin .5s var(--ease) both; }
.log time { color: var(--faint); flex: none; }
.log .k { flex: none; width: 40px; font-weight: 650; }
.log .k.derive, .log .k.add { color: var(--derive); } .log .k.drop { color: var(--muted); }
.log .k.blocked { color: var(--blocked); } .log .k.replan { color: var(--done); }
.empty { color: var(--muted); padding: 90px 20px; text-align: center; font-size: 13.5px; line-height: 1.9; animation: rise .7s var(--ease) both; }
.empty code { background: var(--soft); padding: 2px 8px; border-radius: 6px; font-size: 12.5px; }

/* tooltip */
.tip { position: absolute; z-index: 5; min-width: 180px; max-width: 250px; pointer-events: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 12px;
  box-shadow: 0 18px 40px -16px rgba(0,0,0,.35); opacity: 0; transform: translateY(-4px) scale(.98);
  transition: opacity .2s, transform .25s var(--ease); }
.tip.on { opacity: 1; transform: none; }
.tip .tt { font-weight: 650; font-size: 13px; color: var(--ink); margin-bottom: 4px; }
.tip .ts { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.tip .ts i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.tip .ts.now i, .tip .ts.side i { background: var(--now); } .tip .ts.done i { background: var(--done); }
.tip .ts.blocked i { background: var(--blocked); }
.tip .tx { color: var(--muted); margin-top: 4px; }
.tip .k { color: var(--faint); margin-right: 6px; }

/* graph */
.graph { display: block; font-size: 12.5px; overflow: visible; }
.graph.big { font-size: 13.5px; }
.shine-stop { stop-color: var(--shine); }
.e { fill: none; stroke: var(--edge); stroke-width: 1.4; transition: stroke .7s var(--ease), opacity .6s, d .8s var(--ease); }
.e.walked { stroke: var(--walk); stroke-width: 1.6; }
.e.derive, .e.merge { stroke: var(--derive); stroke-dasharray: 3 5; stroke-linecap: round; opacity: .8; }
.e.replace { stroke: var(--faint); stroke-dasharray: 1 5; stroke-linecap: round; }
.e.flow { stroke: var(--now-edge); stroke-width: 1.8; stroke-dasharray: none; }
.e.faded { opacity: .3; }
.e.intro, .e.enter { animation: efade .9s var(--ease) both; }
@keyframes efade { from { opacity: 0; } }
.e.leave { opacity: 0; }
.pulse { fill: none; stroke: var(--now); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: .14 1.2;
  filter: drop-shadow(0 0 4px var(--now)); animation: travel 1.8s cubic-bezier(.45,0,.25,1) infinite; }
@keyframes travel { from { stroke-dashoffset: .14; } to { stroke-dashoffset: -1.06; } }

.n { transition: transform .8s var(--ease), opacity .45s; cursor: default; }
.n.intro { animation: nodein .7s var(--ease) both; }
.n.enter { animation: nodein .7s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes nodein { from { opacity: 0; filter: blur(4px); } }
.n.leave { opacity: 0; }
.n .box { fill: var(--node); stroke: var(--edge); stroke-width: 1.2; transition: fill .7s var(--ease), stroke .7s var(--ease), stroke-width .4s; }
.n:hover .box { stroke: var(--muted); }
.n .halo { fill: none; stroke: transparent; stroke-width: 1.2; }
.n .ripple { fill: none; stroke: transparent; stroke-width: 2; transform-box: fill-box; transform-origin: center; }
.n .shine { opacity: 0; }
.n .lb { dominant-baseline: central; fill: var(--muted); font-weight: 500; transition: fill .6s; }
.n .ic > * { opacity: 0; transition: opacity .35s; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.n .i-dot { fill: var(--faint); stroke: none; }
.n.left .i-dot { opacity: 1; }
.n.derived.left .box { stroke: var(--derive); stroke-dasharray: 3 3; }

/* done: quiet, so the current step stands out */
.n.done .lb { fill: var(--ink2); }
.n.done .box { stroke: var(--done-line); }
.n .i-done { fill: var(--done-tint); stroke: none; }
.n.done .i-done { opacity: 1; }
.n .i-check { stroke: var(--done); stroke-width: 1.9; stroke-dasharray: 1; stroke-dashoffset: 1;
  transition: opacity .2s, stroke-dashoffset .6s cubic-bezier(.65,0,.35,1) .2s; }
.n.done .i-check { opacity: 1; stroke-dashoffset: 0; }
.n.jd .box { animation: donefill 1.4s var(--ease); }
@keyframes donefill { 0% { fill: var(--done-flash); stroke: var(--done); } 100% { fill: var(--node); stroke: var(--done-line); } }
.n.jd .ripple { animation: ripple 1.2s var(--ease); }
@keyframes ripple { 0% { stroke: var(--done); opacity: .9; transform: scale(1); } 100% { stroke: var(--done); opacity: 0; transform: scale(1.15, 1.7); } }

/* now: the one thing to look at */
.n.now .box, .n.side .box { fill: var(--now-bg); stroke: var(--now); stroke-width: 1.6; stroke-dasharray: none;
  filter: drop-shadow(0 6px 14px var(--glow)); }
.n.side .box { stroke-dasharray: 5 3; filter: none; }
.n.now .lb, .n.side .lb { fill: var(--now); font-weight: 650; }
.n.now .halo { stroke: var(--now); animation: breathe 2.8s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: 0; } 50% { opacity: .4; } }
.n.now .shine { opacity: .5; animation: sweep 3.2s var(--ease) infinite; }
@keyframes sweep { 0% { transform: translateX(0); } 55%, 100% { transform: translateX(260px); } }
.n .i-track { stroke: var(--now-track); stroke-width: 1.8; }
.n .i-spin { stroke: var(--now); stroke-width: 1.8; stroke-dasharray: 26 74; transform-box: fill-box; transform-origin: center; }
.n .i-core { fill: var(--now); stroke: none; }
.n.now .i-track, .n.side .i-track, .n.now .i-spin, .n.side .i-spin, .n.now .i-core, .n.side .i-core { opacity: 1; }
.n.now .i-spin, .n.side .i-spin { animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.n.blocked .box { fill: var(--blocked-bg); stroke: var(--blocked); stroke-width: 1.6; stroke-dasharray: none; animation: nudge 3.5s ease-in-out infinite; }
.n.blocked .lb { fill: var(--blocked); font-weight: 650; }
.n .i-bang { stroke: var(--blocked); stroke-width: 2.2; }
.n.blocked .i-bang { opacity: 1; }
@keyframes nudge { 0%, 90%, 100% { transform: translateX(0); } 93% { transform: translateX(-2px); } 96% { transform: translateX(2px); } }

.n.dropped { opacity: .45; }
.n.dropped .lb { text-decoration: line-through; }
.n.dropped .box { stroke-dasharray: 3 3; }
.n .i-drop { stroke: var(--muted); stroke-width: 1.8; }
.n.dropped .i-drop { opacity: 1; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 760px) {
  .wrap { flex-direction: column; }
  aside { width: auto; max-height: 30vh; padding: 0 16px 8px; }
  main { padding: 6px 16px 32px; }
  header { padding: 0 16px; }
  .summary { display: none; }
}
</style>
</head>

<header>
  <div class="brand">
    <svg width="22" height="14" viewBox="0 0 22 14"><path class="ml" d="M4,7 H18" stroke-width="1.5"/><circle class="m1" cx="4" cy="7" r="3"/><circle class="m1" cx="11" cy="7" r="3"/><circle class="m2" cx="18" cy="7" r="3"/></svg>
    follow_wollof
  </div>
  <div class="summary" id="summary"></div>
  <div class="spacer"></div>
  <button class="reset-order" id="reset-order" hidden title="끌어서 바꾼 순서를 지우고 상태순 자동 정렬로">자동 정렬</button>

    <button data-t="system" title="시스템 설정"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="8.5" rx="1.5"/><path d="M6 14h4"/></svg></button>
    <button data-t="light" title="라이트"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg></button>
    <button data-t="dark" title="다크"><svg viewBox="0 0 16 16"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg></button>
  </div>
</header>
<div class="wrap">
  <aside id="side"></aside>
  <main id="main"></main>

<script type="module">
import { replayPlan, GraphView } from "./graph.js";

const RECENT_MS = 24 * 3600 * 1000;
const RANK = { waiting: 0, busy: 1, idle: 2 };
const KIND = { derive: "파생", add: "추가", drop: "제외", blocked: "막힘", replan: "재계획" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lastActive = s => Math.max(s.statusUpdatedAt || 0, s.updatedAt || 0, (s.mtime || 0) * 1000);
let state = null, selected = null, mode = null;
const panels = new Map();      // key -> { el, view, scrolledTo }
const openOld = new Set();

function ago(ms) {
  if (!ms) return "";
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return "방금";
  if (s < 3600) return Math.floor(s / 60) + "분 전";
  if (s < 86400) return Math.floor(s / 3600) + "시간 전";
  return Math.floor(s / 86400) + "일 전";
}

function sessions() {
  const out = [];
  for (const h of state.hosts) for (const s of h.sessions) {
    let g = null;
    try { g = replayPlan(s.plan); } catch (e) { console.error("plan replay failed", h.name, s.sessionId, e); }
    out.push({ ...s, host: h.name, key: h.name + "/" + s.sessionId, g,
               label: (g && g.title) || s.title || s.lastPrompt || s.name || s.sessionId.slice(0, 8) });
  }
  out.sort((a, b) => (RANK[a.status] ?? 3) - (RANK[b.status] ?? 3) || lastActive(b) - lastActive(a));
  const seen = new Set();   // a resumed session can be reported twice; keep the most active entry
  return out.filter(s => !seen.has(s.key) && seen.add(s.key));
}

// user-defined panel order (drag and drop), kept per browser
let userOrder = [];
try { userOrder = JSON.parse(localStorage.getItem("fw-order") || "[]"); } catch (e) {}
function saveOrder(keys) {
  const visible = new Set(keys);
  userOrder = keys.concat(userOrder.filter(k => !visible.has(k))).slice(0, 300);   // remember sessions that are away
  try { localStorage.setItem("fw-order", JSON.stringify(userOrder)); } catch (e) {}
}
function applyUserOrder(list) {
  if (!userOrder.length) return list;
  const pos = new Map(userOrder.map((k, i) => [k, i]));
  const fresh = list.filter(s => !pos.has(s.key));                  // never placed by hand: show on top
  const placed = list.filter(s => pos.has(s.key)).sort((a, b) => pos.get(a.key) - pos.get(b.key));
  return fresh.concat(placed);
}

function renderSide(all) {
  const item = s => `<div class="item${s.g ? " plan" : ""}${selected === s.key ? " sel" : ""}" data-key="${esc(s.key)}">
      <span class="dot ${esc(s.status)}"></span><span class="t" title="${esc(s.label)}">${esc(s.label)}</span>
      ${s.g ? `<span class="p num">${s.g.done}/${s.g.total}</span>` : ""}</div>`;
  let html = `<div class="item all${selected ? "" : " sel"}" data-key="">전체</div>`;
  for (const h of state.hosts) {
    const mine = all.filter(s => s.host === h.name);
    const recent = mine.filter(s => s.g || s.status !== "idle" || Date.now() - lastActive(s) < RECENT_MS);
    const old = mine.filter(s => !recent.includes(s));
    html += `<div class="host"><span class="dot ${h.connected ? "" : h.lastSeen ? "off" : ""}"></span>${esc(h.name)}
      ${!h.connected && h.error ? `<span class="err" title="${esc(h.error)}">${esc(h.error)}</span>` : ""}</div>`;
    html += recent.map(item).join("");
    if (old.length) html += `<details${openOld.has(h.name) ? " open" : ""} data-host="${esc(h.name)}"><summary>유휴 ${old.length}</summary>${old.map(item).join("")}</details>`;
  }
  const side = document.getElementById("side");
  if (side.innerHTML !== html) side.innerHTML = html;
}

function makePanel(s, big) {
  const el = document.createElement("section");
  el.className = "panel";
  el.innerHTML = `
    <div class="ph" data-key="${esc(s.key)}"><span class="grip" title="끌어서 순서 변경"><svg viewBox="0 0 8 14"><circle cx="2" cy="2" r="1.3"/><circle cx="6" cy="2" r="1.3"/><circle cx="2" cy="7" r="1.3"/><circle cx="6" cy="7" r="1.3"/><circle cx="2" cy="12" r="1.3"/><circle cx="6" cy="12" r="1.3"/></svg></span><span class="dot"></span><span class="title"></span><span class="hostname"></span>
      <span class="meta"><span class="count num"></span>
        <svg class="ring" viewBox="0 0 22 22"><circle class="bg" cx="11" cy="11" r="8.5"/><circle class="fg" cx="11" cy="11" r="8.5" pathLength="100" stroke-dashoffset="100"/></svg></span></div>
    <div class="cur"></div><div class="gbox"></div>${big ? `<div class="log"></div>` : ""}`;
  el.addEventListener("animationend", e => { if (e.target === el) el.style.animation = "none"; });
  return { el, view: new GraphView(el.querySelector(".gbox"), big), scrolledTo: null };
}

function fillPanel(p, s) {
  const g = s.g, el = p.el;
  const finished = g.total > 0 && g.done === g.total;
  el.classList.toggle("finished", finished);
  el.querySelector(".ring .fg").style.strokeDashoffset = 100 - (g.total ? 100 * g.done / g.total : 0);
  el.querySelector(".ph .dot").className = "dot " + s.status;
  el.querySelector(".title").textContent = s.label;
  el.querySelector(".hostname").textContent = s.host;
  el.querySelector(".count").textContent = `${ago(lastActive(s))} · ${g.done}/${g.total}`;
  const curHtml = finished ? `<span class="chip finished"><i></i>모든 단계 완료</span>`
    : g.current.length ? g.current.map(n => `<span class="chip ${n.state}"><i></i>${esc(n.title)}</span>`).join("")
    : `<span class="chip idle"><i></i>진행 중인 단계 없음</span>`;
  const cur = el.querySelector(".cur");
  if (cur.dataset.h !== curHtml) { cur.innerHTML = curHtml; cur.dataset.h = curHtml; }   // re-animate only on change
  p.view.update(g);
  const log = el.querySelector(".log");
  if (log) {
    const html = g.log.length ? g.log.slice().reverse().map(l =>
      `<div><time class="num">${esc((l.t || "").slice(5, 16).replace("T", " "))}</time><span class="k ${l.kind}">${KIND[l.kind] || ""}</span><span>${esc(l.text)}</span></div>`).join("")
      : `<div>계획 변경 없음</div>`;
    if (log.dataset.h !== html) { log.innerHTML = html; log.dataset.h = html; }
  }

  // fit slightly-too-wide graphs; scroll long ones to the current step when it moves
  const box = el.querySelector(".gbox"), svg = p.view.svg, avail = box.clientWidth - 28;
  const minFit = selected ? 0.55 : 0.8;   // the focused view favours seeing the whole plan at once
  const fitted = p.view.width > avail && avail / p.view.width >= minFit;
  svg.style.width = fitted ? avail + "px" : "";
  svg.style.height = fitted ? "auto" : "";
  const curId = g.current[0]?.id;
  if (!fitted && p.view.width > avail && curId && p.scrolledTo !== curId) {
    const right = p.view.focusRight(g);
    box.scrollTo({ left: right + 24 > box.clientWidth ? right - box.clientWidth * 2 / 3 : 0,
                   behavior: p.scrolledTo ? "smooth" : "instant" });
    p.scrolledTo = curId;
  }
}

function renderMain(all) {
  const main = document.getElementById("main");
  const want = selected ? all.filter(s => s.key === selected) : applyUserOrder(all.filter(s => s.g).sort((a, b) =>
    ((a.g.done === a.g.total) - (b.g.done === b.g.total)) || ((RANK[a.status] ?? 3) - (RANK[b.status] ?? 3)) || lastActive(b) - lastActive(a)));
  main.classList.toggle("focus", !!selected);
  document.getElementById("reset-order").hidden = !!selected || !userOrder.length;
  const newMode = selected || "all";
  if (mode !== newMode) { panels.clear(); main.innerHTML = ""; mode = newMode; }
  if (selected && !want.length) { selected = null; return render(); }

  const sel = want[0];
  if (selected && !sel.g) {
    main.innerHTML = `<div class="empty"><b>${esc(sel.label)}</b><br>아직 계획이 등록되지 않은 세션입니다.</div>`;
    return;
  }
  if (!want.length) {
    if (!main.querySelector(".empty")) main.innerHTML = `<div class="empty">계획을 등록한 세션이 아직 없습니다.<br>
      여러 단계 작업을 시작하면 각 세션이 자동으로 등록합니다. 열려 있던 세션에는 <code>/follow</code></div>`;
    return;
  }
  main.querySelector(".empty")?.remove();
  const keys = new Set(want.map(s => s.key));
  for (const [k, p] of panels) if (!keys.has(k)) { p.el.remove(); panels.delete(k); }
  want.forEach((s, i) => {
    let p = panels.get(s.key);
    if (!p) {
      p = makePanel(s, !!selected);
      p.el.style.animationDelay = i * 70 + "ms";
      panels.set(s.key, p);
    }
    if (!p.el.parentNode) main.appendChild(p.el);
    // reorder visually; moving the node would restart every animation inside. Frozen while dragging.
    if (!drag || !drag.active) p.el.style.order = i;
    else if (!p.el.style.order) p.el.style.order = 1000 + i;
    try {
      fillPanel(p, s);
      p.el.querySelector(".panel-err")?.remove();
    } catch (e) {   // one broken plan must not stop the others from drawing
      console.error("panel failed", s.key, e);
      if (!p.el.querySelector(".panel-err")) p.el.insertAdjacentHTML("beforeend", `<div class="panel-err">이 계획을 그리지 못했습니다 (브라우저 콘솔 참고)</div>`);
    }
  });
}

function render() {
  if (!state) return;
  const all = sessions();
  renderSide(all);
  renderMain(all);
  const n = st => all.filter(s => s.status === st).length;
  const active = all.filter(s => s.g && s.g.done < s.g.total).length;
  document.getElementById("summary").innerHTML =
    `<span>진행 중인 계획 <b class="num">${active}</b></span><span>작업 중 <b class="num">${n("busy")}</b></span>` +
    (n("waiting") ? `<span>입력 대기 <b class="num">${n("waiting")}</b></span>` : "");
  document.title = (n("waiting") ? `(${n("waiting")}) ` : "") + "follow_wollof";
}

// theme
const THEMES = ["system", "light", "dark"];
function applyTheme(t) {
  if (!THEMES.includes(t)) t = "system";
  if (t === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  try { localStorage.setItem("fw-theme", t); } catch (e) {}
  document.querySelectorAll("#theme button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  document.querySelector("#theme .thumb").style.transform = `translateX(${THEMES.indexOf(t) * 30}px)`;
}
let savedTheme = "system";
try { savedTheme = localStorage.getItem("fw-theme") || "system"; } catch (e) {}
applyTheme(savedTheme);
document.getElementById("theme").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) applyTheme(b.dataset.t);
});

document.addEventListener("toggle", e => {
  const h = e.target.dataset?.host;
  if (h) e.target.open ? openOld.add(h) : openOld.delete(h);
}, true);
document.addEventListener("click", e => {
  if (justDragged) return;
  const el = e.target.closest(".item, .ph");
  if (!el) return;
  selected = el.dataset.key && selected !== el.dataset.key ? el.dataset.key : null;
  render();
});

// ── drag to reorder panels ─────────────────────────────────────────────
// Panels are never moved in the DOM (that would restart their animations); the drag rewrites CSS `order`
// and animates neighbours with FLIP while the dragged panel follows the pointer.
let drag = null, justDragged = false;
const mainEl = document.getElementById("main");
const orderedPanels = () => [...panels.values()].map(p => p.el).filter(el => el.isConnected)
  .sort((a, b) => (+a.style.order || 0) - (+b.style.order || 0));

mainEl.addEventListener("pointerdown", e => {
  if (selected || e.button !== 0) return;
  const ph = e.target.closest(".ph");
  if (!ph) return;
  drag = { el: ph.closest(".panel"), x0: e.clientX, y0: e.clientY, y: e.clientY, active: false };
});
window.addEventListener("pointermove", e => {
  if (!drag) return;
  drag.y = e.clientY;
  if (!drag.active) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    beginDrag();
  }
  e.preventDefault();
  moveDrag();
});
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

function beginDrag() {
  const list = orderedPanels();
  list.forEach((el, i) => { el.style.order = i; });
  Object.assign(drag, { active: true, list, top0: drag.el.offsetTop, scroll0: mainEl.scrollTop });
  drag.el.classList.remove("settling");
  drag.el.classList.add("dragging");
  document.body.classList.add("is-dragging");
  autoScroll();
}

function moveDrag() {
  const mainTop = mainEl.getBoundingClientRect().top;
  const pointer = drag.y - mainTop + mainEl.scrollTop;          // pointer in scroll-content coordinates
  const others = drag.list.filter(el => el !== drag.el);
  const idx = others.filter(el => el.offsetTop + el.offsetHeight / 2 < pointer).length;
  if (idx !== drag.list.indexOf(drag.el)) {
    const first = new Map(others.map(el => [el, el.getBoundingClientRect().top]));
    drag.list = others.slice(0, idx).concat([drag.el], others.slice(idx));
    drag.list.forEach((el, i) => { el.style.order = i; });
    for (const el of others) {                                     // FLIP: slide neighbours into their new place
      el.style.transition = "none";
      el.style.transform = "";
      const dy = first.get(el) - el.getBoundingClientRect().top;
      if (!dy) continue;
      el.style.transform = `translateY(${dy}px)`;
      el.getBoundingClientRect();
      el.style.transition = "transform .38s cubic-bezier(.22,1,.36,1)";
      el.style.transform = "";
    }
  }
  const t = (drag.y - drag.y0) + (mainEl.scrollTop - drag.scroll0) - (drag.el.offsetTop - drag.top0);
  drag.el.style.transform = `translateY(${t}px) scale(1.012)`;
}

function autoScroll() {                                            // scroll while holding near the top/bottom edge
  if (!drag || !drag.active) return;
  const r = mainEl.getBoundingClientRect(), edge = 70;
  const v = drag.y < r.top + edge ? -(r.top + edge - drag.y) / 4 : drag.y > r.bottom - edge ? (drag.y - (r.bottom - edge)) / 4 : 0;
  if (v) { mainEl.scrollTop += v; moveDrag(); }
  requestAnimationFrame(autoScroll);
}

function endDrag() {
  if (!drag) return;
  const d = drag;
  drag = null;
  if (!d.active) return;
  justDragged = true;
  setTimeout(() => { justDragged = false; }, 0);
  document.body.classList.remove("is-dragging");
  d.el.classList.remove("dragging");
  d.el.classList.add("settling");
  requestAnimationFrame(() => { d.el.style.transform = ""; });
  setTimeout(() => d.el.classList.remove("settling"), 450);
  saveOrder(d.list.map(el => el.querySelector(".ph").dataset.key));
  render();
}

document.getElementById("reset-order").addEventListener("click", () => {
  userOrder = [];
  try { localStorage.removeItem("fw-order"); } catch (e) {}
  render();
});

// ?demo: a scripted plan that moves on its own, no server needed (preview, screenshots)
function startDemo(stepMs) {
  const t0 = Date.now();
  const ev = (op, extra) => ({ op, t: new Date().toISOString(), ...extra });
  const steps = (...xs) => xs.map(([id, title, after]) => ({ id, title, ...(after ? { after } : {}) }));
  const base = () => ({
    rna: [ev("plan", { title: "RNA-seq 차등발현 분석", nodes: steps(["qc", "품질 관리"], ["align", "정렬", ["qc"]], ["count", "유전자 정량", ["align"]],
           ["deg", "DESeq2 비교", ["count"]], ["gsea", "GSEA", ["deg"]], ["gsva", "GSVA", ["deg"]], ["fig", "Figure 정리", ["gsea", "gsva"]]) }), ev("next", { id: "qc" })],
    var: [ev("plan", { title: "WGS 변이 호출 파이프라인", nodes: steps(["fq", "FASTQ 점검"], ["bwa", "BWA 정렬", ["fq"]], ["dedup", "중복 제거", ["bwa"]],
           ["call", "Mutect2 호출", ["dedup"]], ["filter", "필터링", ["call"]], ["anno", "VEP 주석", ["filter"]]) }),
          ev("next", { id: "fq" }), ev("next", { id: "bwa" }), ev("next", { id: "dedup" }), ev("next", { id: "call" })],
    lit: [ev("plan", { title: "문헌 리뷰 정리", nodes: steps(["search", "검색"], ["screen", "선별", ["search"]], ["sum", "요약", ["screen"]]) }),
          ev("next", { id: "search" }), ev("next", { id: "screen" }), ev("next", { id: "sum" }), ev("state", { id: "sum", state: "done" })],
  });
  const script = [
    ["rna", ev("next", { id: "align" })],
    ["var", ev("state", { id: "call", state: "blocked", note: "panel of normals 경로 확인 필요" })],
    ["rna", ev("next", { id: "count" })],
    ["rna", ev("derive", { id: "batch", title: "배치 효과 보정", from: "count", into: ["deg"], reason: "PCA 에서 배치 효과" })],
    ["rna", ev("next", { id: "batch" })],
    ["var", ev("next", { id: "call" })],
    ["rna", ev("next", { id: "deg" })],
    ["rna", ev("drop", { id: "gsva", reason: "GSEA 로 충분", by: "gsea" })],
    ["var", ev("next", { id: "filter" })],
    ["rna", ev("next", { id: "gsea" })],
    ["rna", ev("next", { id: "fig" })],
    ["var", ev("next", { id: "anno" })],
  ];
  let plans = base(), i = 0;
  const now = () => Date.now();
  const status = k => {   // what the session registry would report for this plan state
    const g = replayPlan(plans[k]);
    return g.current.some(n => n.state === "blocked") ? "waiting" : g.done === g.total ? "idle" : "busy";
  };
  const build = () => ({ hosts: [
    { name: "lab-server", connected: true, sessions: [
      { sessionId: "rna", name: "rna-seq", status: status("rna"), updatedAt: now(), plan: plans.rna },
      { sessionId: "var", name: "wgs", status: status("var"), updatedAt: now(), plan: plans.var }] },
    { name: "gpu-box", connected: true, sessions: [
      { sessionId: "idle1", name: "scratch", status: "idle", updatedAt: t0 - 3600e3, title: "노트북 정리" }] },
    { name: "local", connected: true, sessions: [
      { sessionId: "lit", name: "papers", status: "idle", updatedAt: t0 - 600e3, plan: plans.lit }] },
  ]});
  state = build(); render();
  setInterval(() => {
    if (i >= script.length) { i = 0; plans = base(); }
    else { const [k, e] = script[i++]; plans[k] = plans[k].concat([e]); }
    state = build(); render();
  }, stepMs);
  document.getElementById("live-dot").className = "dot on";
  document.getElementById("live-text").textContent = "데모";
  document.getElementById("summary").insertAdjacentHTML("beforebegin", `<a class="demo-pill" href="/" title="실제 세션 화면으로">데모 데이터 · 실제 화면 보기 →</a>`);
}

const params = new URLSearchParams(location.search);
if (params.has("s")) selected = params.get("s");
if (params.has("theme")) applyTheme(params.get("theme"));
if (params.has("demo")) {
  startDemo(+params.get("demo") || 2200);
} else if (params.has("once")) {   // single snapshot without the live stream (screenshots, debugging)
  fetch("/api/state").then(r => r.json()).then(d => { state = d; render(); });
} else {
  const es = new EventSource("/events");
  const dot = document.getElementById("live-dot"), txt = document.getElementById("live-text");
  es.onopen = () => { dot.className = "dot on"; txt.textContent = "실시간"; };
  es.onmessage = e => { state = JSON.parse(e.data); render(); };
  es.onerror = () => { dot.className = "dot off"; txt.textContent = "재연결 중"; };
  setInterval(render, 30000);
}
</script>
</body>
