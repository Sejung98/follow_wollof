@keyframes nudge { 0%, 90%, 100% { transform: translateX(0); } 93% { transform: translateX(-2px); } 96% { transform: translateX(2px); } }

.n.dropped { opacity: .45; }
.n.dropped .lb { text-decoration: line-through; }
.n.dropped .box { stroke-dasharray: 3 3; }
.n .i-drop { stroke: var(--muted); stroke-width: 1.8; }

/* shared bits */
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--hc, var(--faint)); flex: none; }
.dia { display: inline-block; width: 7px; height: 7px; border: 1.5px solid var(--ink2); transform: rotate(45deg); flex: none; margin: 0 1px; }
code { font-family: var(--mono); font-size: 11.5px; }
.hint { font-size: 12px; color: var(--muted); margin: 4px 2px; line-height: 1.6; }
.hint code { background: var(--soft); padding: 1px 5px; border-radius: 2px; }

.ptopics { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 10px 20px 0; font-size: 12px; color: var(--muted); }

.fd { display: inline-block; width: 11px; height: 8px; border: 1.5px solid var(--hc, var(--ink2)); border-radius: 1px 2px 2px 2px; flex: none; position: relative; margin-top: 2px; }
.fd::before { content: ""; position: absolute; left: -1.5px; top: -4px; width: 5px; height: 2.5px; border: 1.5px solid var(--hc, var(--ink2)); border-bottom: 0; border-radius: 1px 1px 0 0; }
.proj { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 8px 10px 3px 14px; }
.row.sub { padding-left: 22px; font-size: 12px; }
.project .core { fill: color-mix(in srgb, var(--hc) 14%, var(--panel)); stroke: var(--hc); stroke-width: 1.5; }
.project .glyph { fill: none; stroke: var(--hc); stroke-width: 1.5; stroke-linejoin: round; }
.project.active .core { stroke-width: 2.2; }
.lnk.owns line { stroke: var(--edge); stroke-width: 1.6; stroke-opacity: .9; }

.ptopics .pn { margin-right: 6px; }
.ptopics .pa { color: var(--ink2); }
.ptopics .pa::before { content: "방향 "; color: var(--muted); }

/* view tabs */
.tabs { position: relative; display: flex; align-self: stretch; gap: 4px; }
.tabs button { all: unset; cursor: pointer; padding: 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; transition: color .2s; }
.tabs button:hover, .tabs button.on { color: var(--ink); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -6px; border-radius: 3px; }
.tabs .bar { position: absolute; bottom: -1px; height: 3px; background: var(--accent); transition: left .35s var(--ease), width .35s var(--ease); }
body[data-view="onto"] .wrap, body[data-view="onto"] #reset-order { display: none !important; }
body[data-view="sessions"] #onto { display: none; }
body[data-view="proj"] .wrap, body[data-view="proj"] #onto, body[data-view="proj"] #reset-order { display: none !important; }
body:not([data-view="proj"]) #proj { display: none; }
body[data-view="todo"] .wrap, body[data-view="todo"] #onto, body[data-view="todo"] #reset-order { display: none !important; }
body:not([data-view="todo"]) #todo { display: none; }

/* ontology layout */
#onto { --navw: 248px; flex: 1; min-height: 0; display: grid; grid-template-columns: var(--navw) minmax(0, 1fr); transition: grid-template-columns .35s var(--ease); }
#onto.has-insp { grid-template-columns: var(--navw) minmax(0, 1fr) 380px; }
body.nav-hidden #onto { --navw: 0px; }
body.nav-hidden #onto .ox { opacity: 0; visibility: hidden; padding-left: 0; padding-right: 0; border-right-width: 0; }
.ox { overflow-y: auto; overflow-x: hidden; min-width: 0; padding: 12px 12px 30px; background: var(--panel); border-right: 1px solid var(--line);
  transition: opacity .25s, visibility .35s, padding .35s var(--ease); }
.ox h3, .insp h3 { font-size: 12px; font-weight: 650; color: var(--muted); margin: 18px 4px 6px; display: flex; gap: 6px; }
.search { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; background: var(--soft); border-radius: 3px;
  box-shadow: inset 0 0 0 1px var(--line); }
.search:focus-within { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.search svg { width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 1.6; flex: none; }
.search input { all: unset; flex: 1; font-size: 12.5px; color: var(--ink); min-width: 0; }
.search input::placeholder { color: var(--faint); }
.ty { display: flex; align-items: center; gap: 9px; padding: 5px 6px; font-size: 12.5px; color: var(--ink2); }
.ty b, .row b { margin-left: auto; font-weight: 600; color: var(--muted); font-size: 12px; }
.row { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 9px; width: 100%; padding: 5px 6px;
  font-size: 12.5px; color: var(--ink2); border-radius: 3px; cursor: pointer; }
.row:hover { background: var(--soft); color: var(--ink); }
.row:focus-visible, .srow:focus-visible, .tag:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.row .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .dot, .row .hs { margin-left: auto; }
.row .dot + b, .row .hs + b { margin-left: 0; }
.row .hs { display: flex; gap: 2px; }
.tg { position: relative; display: flex; align-items: center; gap: 9px; padding: 5px 6px; font-size: 12.5px; color: var(--ink2); cursor: pointer; }
.tg input { position: absolute; opacity: 0; }
.tg span { width: 26px; height: 15px; border-radius: 8px; background: var(--edge); position: relative; flex: none; transition: background .2s; }
.tg span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff;
  transition: transform .25s var(--ease); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.tg input:checked + span { background: var(--accent); }
.tg input:checked + span::after { transform: translateX(11px); }
.tg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* canvas */
.canvas { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
svg.onto { display: block; width: 100%; height: 100%; cursor: grab; user-select: none; -webkit-user-select: none; outline: none; }
svg.onto.grabbing { cursor: grabbing; }
/* ontology sits in space: deep sky, three star depths, the panels as glass on top */
#onto { position: relative; isolation: isolate; }
#onto .space { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(ellipse 55% 45% at 74% 26%, rgba(96,70,200,.30), transparent 70%),
    radial-gradient(ellipse 45% 55% at 18% 82%, rgba(16,128,150,.24), transparent 70%),
    radial-gradient(ellipse 35% 30% at 48% 58%, rgba(200,64,150,.10), transparent 70%),
    radial-gradient(ellipse 120% 100% at 50% 40%, #0c1224 0%, #05070d 80%); }
.space .st { position: absolute; inset: -40px; background-repeat: repeat; }
.space .s1 { opacity: .75; background-position: calc(var(--px, 0) * .03px) calc(var(--py, 0) * .03px); }
.space .s2 { opacity: .9; background-position: calc(var(--px, 0) * .08px) calc(var(--py, 0) * .08px); animation: twinkle 7s ease-in-out infinite; }
.space .s3 { background-position: calc(var(--px, 0) * .16px) calc(var(--py, 0) * .16px); animation: twinkle 11s ease-in-out -4s infinite; }
@keyframes twinkle { 50% { opacity: .4; } }
.meteor { position: absolute; top: 14%; left: 78%; width: 150px; height: 1.5px; border-radius: 1px; opacity: 0;
  background: linear-gradient(90deg, #fff, rgba(190,210,255,.5) 30%, transparent); filter: drop-shadow(0 0 4px rgba(200,220,255,.9));
  transform: rotate(-24deg); animation: meteor 13s linear 5s infinite; }
@keyframes meteor { 0% { opacity: 0; transform: rotate(-24deg) translateX(0); } 1% { opacity: 1; }
  6% { opacity: 0; transform: rotate(-24deg) translateX(-560px); } 100% { opacity: 0; transform: rotate(-24deg) translateX(-560px); } }
#onto .ox, #onto .insp { background: color-mix(in srgb, var(--panel) 40%, transparent); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); }
#onto .legend, #onto .zoom { background: color-mix(in srgb, var(--panel) 45%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
#onto .search { background: color-mix(in srgb, var(--soft) 80%, transparent); }
.session .sheen { pointer-events: none; }
.session.ended .sheen, .session.noplan .sheen { opacity: .4; }
#onto .host .core { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--hc) 55%, transparent)); }
#onto .project .core { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--hc) 40%, transparent)); }
#onto .session.active .core { filter: drop-shadow(0 0 9px color-mix(in srgb, var(--hc) 75%, transparent)); }
#onto .topic .core { filter: drop-shadow(0 0 6px rgba(200,215,255,.35)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #onto { --bg: #060912; --panel: #0e1424; --soft: rgba(255,255,255,.06); --line: rgba(255,255,255,.08);
    --edge: rgba(160,180,230,.3); --faint: #56627a; --grid: rgba(255,255,255,.05); } }
:root[data-theme="dark"] #onto { --bg: #060912; --panel: #0e1424; --soft: rgba(255,255,255,.06); --line: rgba(255,255,255,.08);
    --edge: rgba(160,180,230,.3); --faint: #56627a; --grid: rgba(255,255,255,.05); }
/* light theme: a pale dawn sky, stars as faint ink */
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) #onto .space { background:
    radial-gradient(ellipse 55% 45% at 74% 26%, rgba(150,130,240,.16), transparent 70%),
    radial-gradient(ellipse 45% 55% at 18% 82%, rgba(60,170,200,.14), transparent 70%),
    linear-gradient(180deg, #f4f6fb, #e8ecf5); }
  :root:not([data-theme="dark"]) #onto .st { filter: invert(1); opacity: .22; animation: none; }
  :root:not([data-theme="dark"]) #onto .meteor { display: none; } }
:root[data-theme="light"] #onto .space { background:
    radial-gradient(ellipse 55% 45% at 74% 26%, rgba(150,130,240,.16), transparent 70%),
    radial-gradient(ellipse 45% 55% at 18% 82%, rgba(60,170,200,.14), transparent 70%),
    linear-gradient(180deg, #f4f6fb, #e8ecf5); }
:root[data-theme="light"] #onto .st { filter: invert(1); opacity: .22; animation: none; }
:root[data-theme="light"] #onto .meteor { display: none; }
.lnk line { stroke: var(--edge); stroke-width: 1.2; transition: opacity .25s, stroke .25s; }
.lnk.runs line { stroke-opacity: .55; }
.lnk.topic line { stroke: var(--muted); stroke-opacity: .7; stroke-width: 1.4; }
.lnk.similar line { stroke: var(--derive); stroke-dasharray: 4 4; stroke-opacity: .8; }
.lnk.hl line { stroke: var(--accent); stroke-opacity: 1; stroke-width: 1.8; }
.el { font-size: 10.5px; fill: var(--ink2); text-anchor: middle; opacity: 0; pointer-events: none; transition: opacity .2s;
  paint-order: stroke; stroke: var(--bg); stroke-width: 3.5px; stroke-linejoin: round; }
.lnk.hl .el { opacity: 1; }
.dim .on:not(.hl):not(.sel) { opacity: .2; }
.dim .lnk:not(.hl) { opacity: .1; }
.on { cursor: pointer; transition: opacity .25s; }
.on .hit { fill: transparent; }
.on .sel-ring { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; transition: opacity .2s; }
.on.sel .sel-ring { opacity: 1; }
.on:hover .sel-ring { opacity: .45; }
.on.sel:hover .sel-ring { opacity: 1; }
.nl { font-size: 12px; font-weight: 600; fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.ns { font-size: 10.5px; fill: var(--muted); text-anchor: middle; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.session .track { fill: none; stroke: var(--soft); stroke-width: 3; }
.session .prog { fill: none; stroke: var(--hc); stroke-width: 3; stroke-dasharray: 100; transition: stroke-dashoffset .9s var(--ease); }
.session .core { fill: color-mix(in srgb, var(--hc) 24%, var(--panel)); stroke: var(--hc); stroke-width: 1.5; }
.session .glyph { fill: none; stroke: var(--hc); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.session.finished .glyph { opacity: 1; }
.session .badge, .host .badge { fill: transparent; stroke: none; }
.session.waiting .badge { fill: var(--derive); stroke: var(--bg); stroke-width: 2; }
.session.blocked .badge, .host.off .badge { fill: var(--blocked); stroke: var(--bg); stroke-width: 2; }
.session .pulse { fill: none; stroke: var(--now); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
.session.busy .pulse { animation: opulse 2.4s var(--ease) infinite; }
@keyframes opulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.1); } }
.session.ended { opacity: .55; }
.session.ended .core { stroke-dasharray: 3 2.5; }
.dim .session.ended.hl { opacity: .8; }
.session.noplan .core { fill: var(--panel); }
.topic .core { fill: var(--panel); stroke: var(--ink2); stroke-width: 1.6; }
.topic .hash { font-size: 12px; font-weight: 700; fill: var(--ink2); text-anchor: middle; dominant-baseline: central; }
.host .core { fill: var(--hc); }
.host .glyph { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; opacity: .92; }
.host.off .core { fill: color-mix(in srgb, var(--hc) 35%, var(--panel)); }
.legend { position: absolute; left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 7px 11px; font-size: 11.5px; color: var(--muted);
  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 3px; backdrop-filter: blur(6px); max-width: calc(100% - 80px); }
.legend span { display: flex; align-items: center; gap: 7px; }
.lg-host, .lg-sess, .lg-topic, .lg-sim { display: inline-block; flex: none; }
.lg-host { width: 10px; height: 10px; border-radius: 2px; background: var(--ink2); }
.lg-sess { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ink2); }
.lg-topic { width: 8px; height: 8px; border: 1.5px solid var(--ink2); transform: rotate(45deg); margin: 0 1px; }
.lg-sim { width: 14px; border-top: 1.5px dashed var(--derive); }
.zoom { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; }
.zoom button { all: unset; cursor: pointer; width: 30px; height: 28px; display: grid; place-items: center; font-size: 16px; color: var(--ink2); }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button:hover { background: var(--soft); color: var(--ink); }
.zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.zoom svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.empty-onto { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--muted); font-size: 13.5px; line-height: 1.9; pointer-events: none; }
.empty-onto[hidden] { display: none; }
.empty-onto code { background: var(--soft); padding: 2px 8px; border-radius: 3px; }

/* inspector */
.insp { position: relative; overflow-y: auto; padding: 14px 18px 24px; background: var(--panel); border-left: 1px solid var(--line);
  animation: slidein .35s var(--ease) both; }
@keyframes slidein { from { opacity: 0; transform: translateX(16px); } }
.insp[hidden] { display: none; }
.ih { display: flex; align-items: center; }
.ik { font-size: 11.5px; font-weight: 650; color: var(--ink2); padding: 1px 8px 1px 7px; border-left: 3px solid var(--hc, var(--ink2)); background: var(--soft); border-radius: 0 3px 3px 0; }
.x { all: unset; cursor: pointer; margin-left: auto; width: 26px; height: 26px; display: grid; place-items: center; font-size: 18px; color: var(--muted); border-radius: 3px; }
.x:hover { background: var(--soft); color: var(--ink); }
.insp h2 { font-size: 17px; font-weight: 700; letter-spacing: -.02em; line-height: 1.35; margin: 10px 0 12px; overflow-wrap: anywhere; }
.prog-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.segbar { display: flex; gap: 2px; height: 6px; }
.segbar i { flex: 1; background: var(--soft); border-radius: 1px; }
.segbar i.done { background: var(--done); } .segbar i.now, .segbar i.side { background: var(--now); } .segbar i.blocked { background: var(--blocked); }
.insp .cur { padding: 10px 0 0; min-height: 0; }
.props { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 7px 10px; margin: 16px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.props dt { color: var(--muted); }
.props dd { margin: 0; color: var(--ink2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.props code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.props .err { color: var(--blocked); }
.tag { all: unset; cursor: pointer; font-size: 12px; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 0 7px; border-radius: 2px; }
.tag:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.hchip { display: inline-flex; align-items: center; gap: 5px; }
.st { font-size: 11.5px; font-weight: 600; color: var(--muted); flex: none; }
.st.busy { color: var(--now); } .st.waiting { color: var(--derive); } .st.ended { color: var(--faint); }
.mini { overflow-x: auto; padding: 10px; border: 1px solid var(--line); border-radius: 3px; scrollbar-width: thin;
  background-image: radial-gradient(var(--grid) 1px, transparent 1.2px); background-size: 16px 16px; }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 3px; }
.srow { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: flex-start; gap: 9px; padding: 9px 10px; }
.srow + .srow { border-top: 1px solid var(--line); }
.srow:hover { background: var(--soft); }
.srow .sw { margin-top: 5px; }
.srow .sb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.srow .t { font-size: 12.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .an { font-size: 11.5px; color: var(--muted); }
.srow .segbar { height: 4px; }
.primary { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; margin-top: 20px; padding: 8px 0; text-align: center;
  font-size: 13px; font-weight: 650; color: #fff; background: var(--accent); border-radius: 3px; transition: filter .2s; }
.primary:hover { filter: brightness(1.1); }
.primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }


/* ontology: hierarchy — hosts and projects anchor, sessions needing attention speak, the rest step back */
.nl { font-size: 11.5px; font-weight: 500; fill: var(--ink2); }
.host .nl { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
.project .nl, .topic .nl, .session.active .nl, .on.sel .nl, .on.hl .nl { font-weight: 650; fill: var(--ink); }
.ns { font-size: 10px; }
.session:not(.active) .core { fill: color-mix(in srgb, var(--hc) 10%, var(--panel)); stroke-opacity: .55; }
.session:not(.active) .prog { stroke-opacity: .5; }
.session.finished:not(.active) .glyph { opacity: .6; }
.session.active .core { stroke-width: 2; }
.ilog { list-style: none; margin: 0; padding: 0; font-size: 12px; color: var(--ink2); border-left: 1px solid var(--line); }
.ilog li { position: relative; display: flex; gap: 10px; padding: 3px 0 7px 14px; }
.ilog li::before { content: ""; position: absolute; left: -4px; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--panel); border: 1.5px solid var(--faint); }
.ilog li.derive::before, .ilog li.add::before { border-color: var(--derive); }
.ilog li.blocked::before { border-color: var(--blocked); }
.ilog li.replan::before, .ilog li.topic::before { border-color: var(--done); }
.ilog time { flex: none; color: var(--muted); }

/* step outputs */
.ficon { flex: none; display: block; }
.fi-page { fill: var(--panel); stroke: var(--faint); stroke-width: 1.1; }
.fi-fold { fill: none; stroke: var(--faint); stroke-width: 1.1; stroke-linejoin: round; }
.fi-t { fill: #fff; font: 700 5.6px/1 var(--mono); text-anchor: middle; letter-spacing: .02em; }
.outs { padding: 4px 20px 14px; }
.outs .sec, .insp h3.sec { font-size: 12px; font-weight: 650; color: var(--muted); margin: 6px 0 8px; display: flex; gap: 6px; }
.ostep { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); align-items: start; }
.os-t { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink2); padding-top: 6px; min-width: 0; }
.sd { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.sd.done { background: var(--done); } .sd.now, .sd.side { background: var(--now); } .sd.blocked { background: var(--blocked); }
.ofiles { display: flex; flex-wrap: wrap; gap: 6px; }
.otile { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 8px; max-width: 280px; padding: 5px 10px 5px 7px;
  border: 1px solid var(--line); border-radius: 3px; background: var(--panel); transition: border-color .2s, background .2s; }
.otile:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.otile:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ot-n { font-size: 12.5px; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ot-t { font-size: 11px; color: var(--muted); flex: none; }
.otile.new { animation: tilein .9s var(--ease) both; }
@keyframes tilein { 0% { opacity: 0; transform: translateY(6px) scale(.96); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
  60% { opacity: 1; transform: none; box-shadow: 0 0 0 5px transparent; } }
.outs.compact .ostep { grid-template-columns: minmax(0, 1fr); gap: 5px; }
.outs.compact .os-t { padding-top: 0; }
.outs.compact .otile { max-width: 100%; width: 100%; }
.insp .outs { padding: 0; border-bottom: 1px solid var(--line); }
/* badge on a plan node: this step left files */
.n .ob { opacity: 0; pointer-events: none; cursor: pointer; transition: opacity .3s; }
.n.has-out .ob { opacity: 1; pointer-events: auto; }
.ob-bg { fill: var(--panel); stroke: var(--edge); stroke-width: 1; transition: stroke .2s; }
.ob:hover .ob-bg { stroke: var(--accent); }
.ob-doc { fill: none; stroke: var(--ink2); stroke-width: 1.1; stroke-linejoin: round; }
.ob-n { font-size: 9.5px; font-weight: 700; fill: var(--ink2); dominant-baseline: central; }
.n.out-pop .ob { animation: efade .5s both; }
.n.out-pop .ob-bg { animation: obflash 1.3s var(--ease); }
@keyframes obflash { 0%, 35% { fill: color-mix(in srgb, var(--accent) 35%, var(--panel)); stroke: var(--accent); stroke-width: 2; } }
/* stalled: in progress on paper, nothing recorded for a while */
.chip.stale { color: var(--derive); background: color-mix(in srgb, var(--derive) 13%, var(--panel)); }
.chip.stale i { animation: none; }
.n.now.stale .box { stroke: var(--derive); stroke-dasharray: 4 3; fill: color-mix(in srgb, var(--derive) 9%, var(--node)); filter: none; }
.n.now.stale .lb { fill: var(--derive); }
.n.now.stale .halo, .n.now.stale .shine { animation: none; opacity: 0; }
.n.now.stale .i-spin { stroke: var(--derive); animation-duration: 4s; }
.n.now.stale .i-core { fill: var(--derive); }
.kpi.stale i { background: var(--derive); border-radius: 1px; transform: rotate(45deg); }
.session.stale .trail, .session.stale .comet { opacity: 0 !important; animation: none !important; }
.session.stale .track { stroke: var(--derive); stroke-dasharray: 2 3; }
.ns.slow, .ns.cur.slow { fill: var(--derive); font-weight: 600; }
/* viewer */
.vw { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; }
.vw[hidden] { display: none; }
.vw-back { position: absolute; inset: 0; background: rgba(17,20,24,.62); backdrop-filter: blur(3px); animation: efade .25s both; }
.vw-box { position: relative; width: min(1280px, calc(100vw - 48px)); height: calc(100vh - 64px); display: grid; grid-template-columns: 260px minmax(0, 1fr);
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6);
  animation: vwin .35s var(--ease) both; }
@keyframes vwin { from { opacity: 0; transform: translateY(10px) scale(.985); } }
.vw-list { overflow-y: auto; border-right: 1px solid var(--line); padding: 14px 10px 20px; background: var(--bg); }
.vw-sess { padding: 0 6px 10px; display: flex; flex-direction: column; gap: 2px; }
.vw-sess b { font-size: 13.5px; } .vw-sess span { font-size: 11.5px; color: var(--muted); }
.vw-step { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 650; color: var(--ink2); padding: 12px 6px 4px; }
.vw-step span { margin-left: auto; font-weight: 500; color: var(--muted); font-size: 11px; }
.vw-row { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 9px; width: 100%; padding: 5px 6px; border-radius: 3px; font-size: 12.5px; color: var(--ink2); }
.vw-row span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vw-row:hover { background: var(--soft); }
.vw-row.on { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
.vw-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.vw-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.vw-bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); }
.vw-tt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vw-tt b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vw-tt span { font-size: 11.5px; color: var(--muted); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vw-btn { font-size: 12px; font-weight: 600; color: var(--ink2); text-decoration: none; padding: 5px 10px; border-radius: 3px; background: var(--soft); flex: none; }
.vw-btn:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--edge); }
.vw-x { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; font-size: 20px; color: var(--muted); border-radius: 3px; }
.vw-x:hover { background: var(--soft); color: var(--ink); }
.vw-body { flex: 1; min-height: 0; overflow: auto; background: var(--bg); }
.vw-body iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
.vw-img { min-height: 100%; display: grid; place-items: center; padding: 20px;
  background-image: radial-gradient(var(--grid) 1px, transparent 1.2px); background-size: 16px 16px; }
.vw-img img { max-width: 100%; max-height: calc(100vh - 160px); box-shadow: 0 0 0 1px var(--line); background: #fff; }
.vw-body pre { margin: 0; padding: 16px 20px; font: 12px/1.6 var(--mono); color: var(--ink2); white-space: pre-wrap; overflow-wrap: anywhere; }
.vw-table table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.vw-table th, .vw-table td { padding: 5px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.vw-table th { position: sticky; top: 0; background: var(--panel); color: var(--ink); font-weight: 650; }
.vw-table td { color: var(--ink2); }
.vw-note, .vw-wait { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 30px; text-align: center; color: var(--muted); }
.vw-note b { font-size: 15px; color: var(--ink); margin-top: 6px; }
.vw-note p { margin: 0 0 6px; font-size: 13px; }
.vw-note .primary { width: auto; padding: 8px 22px; margin: 0; }
body.vw-open { overflow: hidden; }

/* ontology: what is running right now */
.session .trail, .session .comet { fill: none; opacity: 0; transform-box: fill-box; transform-origin: center; }
.session .trail { stroke: var(--now); stroke-width: 2; stroke-dasharray: 26 74; stroke-linecap: round; }
.session .comet { stroke: var(--now); stroke-width: 3.2; stroke-dasharray: 3 97; stroke-dashoffset: -23; stroke-linecap: round;
  filter: drop-shadow(0 0 4px var(--now)); }
.session.busy .trail { opacity: .35; animation: orbit 1.8s linear infinite; }
.session.busy .comet { opacity: 1; animation: orbit 1.8s linear infinite; }
@keyframes orbit { to { transform: rotate(360deg); } }
.session.busy .core { animation: corebreathe 2.6s ease-in-out infinite; }
@keyframes corebreathe { 50% { fill: color-mix(in srgb, var(--hc) 42%, var(--panel)); } }
.session.waiting .trail { opacity: .8; stroke: var(--derive); stroke-dasharray: 100 0; stroke-width: 1.5; animation: waitring 2.4s ease-in-out infinite; }
@keyframes waitring { 0%, 100% { opacity: .15; transform: scale(.94); } 50% { opacity: .8; transform: scale(1.04); } }
.session.blocked .badge, .session.waiting .badge { animation: badgeblink 1.6s ease-in-out infinite; }
@keyframes badgeblink { 50% { opacity: .35; } }
.session .pulse { stroke-width: 1.5; }
.session.busy .pulse { animation-duration: 3s; }
.ns.cur { fill: var(--now); font-weight: 600; }
.ns.bad { fill: var(--blocked); }
.lnk.live line { stroke: var(--now); stroke-opacity: .75; stroke-width: 1.6; stroke-dasharray: 3 7; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -10; } }
.dim .lnk.live:not(.hl) { opacity: .25; }
.project .live-dot { fill: transparent; }
.project.active .live-dot { fill: var(--now); stroke: var(--bg); stroke-width: 2; animation: badgeblink 1.6s ease-in-out infinite; }

html.calm *, html.calm *::before, html.calm *::after { animation: none !important; transition: none !important; }
@media (max-width: 760px) {
  .wrap { flex-direction: column; }
  aside { width: auto; max-height: 30vh; padding: 0 16px 8px; }
  main { padding: 6px 16px 32px; }
  header { padding: 0 16px; }
  .summary { display: none; }
  #onto, #onto.has-insp { grid-template-columns: minmax(0, 1fr); }
  .ox, .legend { display: none; }
  .insp { position: fixed; left: 0; right: 0; bottom: 0; max-height: 62vh; z-index: 20; border-left: 0; border-top: 1px solid var(--line);
    box-shadow: 0 -16px 40px -20px rgba(0,0,0,.5); }
  .tabs button { padding: 0 8px; }
  header { gap: 10px; padding: 0 12px; }
  #live-text, .demo-pill, .kpi.plain { display: none; }
  .vw-box { width: 100vw; height: 100vh; border-radius: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .vw-list { max-height: 28vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .ostep { grid-template-columns: minmax(0, 1fr); gap: 5px; }
  .os-t { padding-top: 0; }
}

/* project view: projects on the left, the selected project as a map, details on the right */
#proj { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr) 368px; background: var(--bg); }
body.nav-hidden #proj { grid-template-columns: 0 minmax(0, 1fr) 368px; }
body.nav-hidden #proj .pj-rail { visibility: hidden; border: 0; }
.pj-rail { overflow-y: auto; padding: 14px 0; background: var(--panel); border-right: 1px solid var(--line); }
.pj-p { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 3px; width: 100%; padding: 11px 18px 12px;
  border-left: 2px solid transparent; cursor: pointer; color: var(--ink); }
.pj-p:hover { background: color-mix(in srgb, var(--bg) 60%, var(--panel)); }
.pj-p.on { border-left-color: var(--ink); background: var(--bg); }
.pj-p:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pj-p .nm { font-size: 15px; font-weight: 500; letter-spacing: -.01em; }
.pj-p .hs { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; color: var(--muted); }
.pj-p .hs i, .pj-head .scan i, #proj .drow .hd i, #proj .rrow i, #proj .who i, #proj .part i {
  display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.pj-p .live { font-size: 12px; display: flex; align-items: center; gap: 6px; color: var(--ink); }
.pj-p .live .quiet { color: var(--muted); }
.pj-p .live .wait { color: var(--amber); }
.pj-p svg .trk { fill: none; stroke: var(--line); stroke-width: 1.5; }
.pj-p svg .sweep { fill: none; stroke: var(--ink); stroke-width: 1.5; }

.pj-stage { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; overflow: hidden; }
.pj-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 18px; padding: 18px 24px 0; }
.pj-head h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -.015em; }
.pj-head .scans { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.pj-head .scan.bad { color: var(--amber); }
.pj-head .scan.busy::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 6px; border-radius: 50%;
  border: 1.5px solid var(--line); border-top-color: var(--ink); animation: pjspin 1s linear infinite; vertical-align: -1px; }
.pj-refresh { all: unset; margin-left: auto; cursor: pointer; font-size: 12.5px; padding: 5px 12px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--panel); color: var(--ink); }
.pj-refresh:hover { border-color: var(--ink); }
.pj-refresh:disabled { opacity: .45; cursor: default; }
.pj-refresh:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pj-map { display: block; width: 100%; height: 100%; min-height: 0; }
.pj-legend { position: absolute; left: 24px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); pointer-events: none; }
.pj-legend .lg { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border-radius: 50%; vertical-align: -2px; }
.pj-legend .lg.ring { border: 2px solid var(--ink); }
.pj-legend .lg.rep { width: 9px; height: 9px; background: var(--muted); opacity: .6; }
.pj-legend .lg.dash { border: 1.5px dashed var(--muted); }
.pj-legend .lg-note { color: var(--faint); }

#proj text { font-family: inherit; }
#proj .hair { stroke: var(--line); stroke-width: 1; }
#proj .hair.dash { stroke-dasharray: 2 4; }
#proj .link { fill: none; stroke: var(--line); stroke-width: 1.2; }
#proj .link.live { stroke: var(--link); }
#proj .t-hub { font-size: 22px; font-weight: 500; fill: var(--ink); text-anchor: middle; letter-spacing: -.01em; }
#proj .t-hubs { font-size: 11.5px; fill: var(--muted); text-anchor: middle; }
#proj .t-data { font-size: 12.5px; font-weight: 500; fill: var(--ink); text-anchor: middle; }
#proj .t-data.big { font-size: 16px; }
#proj .t-n { font-size: 11px; fill: var(--muted); text-anchor: middle; font-variant-numeric: tabular-nums; }
#proj .t-n.start { text-anchor: start; }
#proj .t-node { font-size: 13px; fill: var(--ink); }
#proj .t-sub { font-size: 11.5px; fill: var(--muted); }
#proj .t-wait { font-size: 11.5px; fill: var(--amber); }
#proj .t-cap { font-size: 11.5px; fill: var(--faint); }
#proj .t-plus { font-size: 12px; fill: var(--muted); text-anchor: middle; }
#proj .dn { cursor: zoom-in; outline: none; }
#proj .dn rect { fill: var(--panel); stroke: var(--ink); stroke-width: 1; transition: stroke-width .15s; }
#proj .dn:hover rect, #proj .dn:focus-visible rect { stroke-width: 2; }
#proj .slot { cursor: zoom-in; outline: none; }
#proj .slot circle { fill: var(--panel); stroke: var(--dash); stroke-dasharray: 3 3; }
#proj .slot .lbl { opacity: 0; transition: opacity .2s; }
#proj .slot:hover .lbl, #proj .slot:focus-visible .lbl, #proj .slot.show .lbl { opacity: 1; }
#proj .slot:hover circle { stroke: var(--ink); }
#proj .an { cursor: pointer; outline: none; }
#proj .an .hit { fill: transparent; }
#proj .an .core { stroke: var(--panel); stroke-width: 1.5; }
#proj .an:hover .core, #proj .an:focus-visible .core { stroke: var(--ink); }
#proj .an.sel .core { stroke: var(--ink); stroke-width: 2.2; }
#proj .an.ended { opacity: .55; }
#proj .an.rep .core { opacity: .6; }
#proj .tick { fill: none; stroke: var(--panel); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#proj .seg { fill: none; stroke-width: 3; }
#proj .seg.left { stroke: var(--line); }
#proj .seg.wait { stroke: var(--amber); }
#proj .kbox { fill: var(--panel); stroke: var(--dash); }
#proj .center { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
#proj .bead { fill: var(--panel); stroke: var(--dash); stroke-width: 1.2; }
#proj .bead.bad { fill: var(--amber); stroke: var(--amber); }
#proj .ring-wait { fill: none; stroke: var(--amber); stroke-width: 1.5; }
#proj .halo { fill: none; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: pjhalo 2.2s cubic-bezier(.2,.6,.3,1) infinite; }

/* motion only where something is happening */
#proj .sweep { stroke-dasharray: 6 200; stroke-linecap: round; animation: pjsweep 2.4s cubic-bezier(.45,0,.25,1) infinite; }
#proj .breathe { animation: pjbreathe 2.8s ease-in-out infinite; }
#proj .stamp { animation: pjstamp .55s cubic-bezier(.2,.7,.2,1) both; }
#proj .pop { transform-box: fill-box; transform-origin: center; animation: pjpop .5s cubic-bezier(.2,.8,.2,1.2); }
#proj .reveal { opacity: 0; animation: pjreveal .45s ease-out forwards; }
#proj .draw { stroke-dasharray: 400; animation: pjdraw .7s ease-out both; }
@keyframes pjsweep { from { stroke-dashoffset: 6; } to { stroke-dashoffset: -60; } }
@keyframes pjbreathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes pjstamp { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
@keyframes pjpop { 40% { transform: scale(1.14); } }
@keyframes pjreveal { to { opacity: 1; } }
@keyframes pjdraw { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
@keyframes pjhalo { 0% { opacity: .8; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes pjspin { to { transform: rotate(360deg); } }
@keyframes pjripple { 0% { opacity: .9; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.5); } }

/* details */
#proj aside.pj-insp { width: auto; overflow-y: auto; padding: 22px 22px 32px; background: var(--panel); border-right: 0; border-left: 1px solid var(--line); min-width: 0; }
.pj-insp h2 { margin: 8px 0 4px; font-size: 19px; font-weight: 500; letter-spacing: -.01em; line-height: 1.35; }
.pj-insp h3 { margin: 24px 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.pj-insp h4 { margin: 20px 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.pj-insp h3 small, .pj-insp h4 small { font-weight: 400; color: var(--faint); }
.pj-insp .ik { display: inline-block; }
.pj-insp .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; margin: 16px 0 0; border-top: 1px solid var(--line); }
.pj-insp .kv div { padding: 9px 0 8px; border-bottom: 1px solid var(--line); }
.pj-insp .kv div:nth-child(2n) { padding-left: 14px; border-left: 1px solid var(--line); }
.pj-insp .kv dt { font-size: 11.5px; color: var(--muted); }
.pj-insp .kv dd { margin: 1px 0 0; font-size: 16px; font-weight: 500; white-space: nowrap; }
.pj-insp .kv small { font-size: 11px; font-weight: 400; color: var(--muted); }
.pj-insp .kv small.w { color: var(--amber); }
.pj-insp .dlist { display: flex; flex-direction: column; }
.pj-insp .root { font-size: 11.5px; color: var(--faint); margin: 10px 0 2px; }
.pj-insp .drow { all: unset; box-sizing: border-box; cursor: zoom-in; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px;
  padding: 9px 2px 10px; border-top: 1px solid var(--line); }
.pj-insp .drow:hover .dn-n { text-decoration: underline; text-underline-offset: 3px; }
.pj-insp .drow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pj-insp .dn-n { font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 8px; min-width: 0; }
.pj-insp .dn-n .hd { display: inline-flex; gap: 2px; }
.pj-insp .dn-n .hd i { margin: 0; }
.pj-insp .dn-v { font-size: 13px; text-align: right; }
.pj-insp .bar { grid-column: 1 / -1; height: 4px; background: var(--soft); border-radius: 2px; overflow: hidden; }
.pj-insp .bar i { display: block; height: 100%; background: var(--ink); opacity: .72; border-radius: 2px; }
.pj-insp .dn-m { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pj-insp .dn-t { font-size: 11.5px; color: var(--faint); text-align: right; white-space: nowrap; }
.pj-insp .finds, .pj-insp .ideas { list-style: none; margin: 0; padding: 0; }
.pj-insp .finds li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.5; }
.pj-insp .finds time { font-size: 11.5px; color: var(--muted); padding-top: 2px; }
.pj-insp .finds li span::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 8px 1px 0; background: var(--ink); transform: rotate(45deg); }
.pj-insp .tag, .pj-insp em.tag { font-style: normal; margin-left: 6px; }
.pj-insp em.tag { font-size: 11px; color: var(--muted); background: var(--soft); padding: 0 6px; border-radius: 3px; }
.pj-insp .ideas li { position: relative; padding: 6px 0 6px 18px; border-top: 1px solid var(--line); font-size: 13px; }
.pj-insp .ideas li::before { content: ""; position: absolute; left: 1px; top: 12px; width: 9px; height: 9px; border-radius: 50%; border: 1.2px dashed var(--muted); }
.pj-insp .rlist { display: flex; flex-direction: column; }
.pj-insp .rrow { all: unset; cursor: pointer; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 6px;
  padding: 6px 2px; border-top: 1px solid var(--line); font-size: 13px; }
.pj-insp .rrow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pj-insp .rrow time { font-size: 11.5px; color: var(--muted); }
.pj-insp .rrow:hover span { text-decoration: underline; text-underline-offset: 3px; }
.pj-insp .rrow i { opacity: .7; }
.pj-insp .back { all: unset; cursor: pointer; font-size: 12.5px; color: var(--muted); margin-bottom: 10px; display: block; }
.pj-insp .back:hover { color: var(--ink); }
.pj-insp .who { display: flex; align-items: center; font-size: 13px; color: var(--muted); }
.pj-insp .warn { color: var(--amber); font-size: 13px; margin: 12px 0 0; }
.pj-insp .note { color: var(--ink2); font-size: 13px; margin: 6px 0 0; }
.pj-insp .path { display: block; font-size: 11.5px; color: var(--ink2); word-break: break-all; background: var(--soft); padding: 4px 7px; border-radius: 3px; }
.pj-insp .part { display: grid; grid-template-columns: 14px auto minmax(0, 1fr); align-items: center; gap: 4px 6px; margin: 0 0 6px; font-size: 12.5px; }
.pj-insp .exts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
.pj-insp .exts b { color: var(--ink); font-weight: 500; }
.pj-insp .steps { list-style: none; margin: 0; padding: 0; }
.pj-insp .steps li { display: grid; grid-template-columns: 18px minmax(0, 1fr); align-items: center; gap: 8px; padding: 5px 0; color: var(--faint); font-size: 13px; }
.pj-insp .steps li.done, .pj-insp .steps li.cur { color: var(--ink); }
.pj-insp .steps li.cur { font-weight: 500; }
.pj-insp .steps .mk { position: relative; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); }
.pj-insp .steps li.done .mk { background: var(--ink); border-color: var(--ink); }
.pj-insp .steps li.done .mk::after { content: ""; position: absolute; left: 3px; top: 1px; width: 3px; height: 6px; border: solid var(--panel); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
.pj-insp .steps li.cur .mk { border-color: var(--hc); }
.pj-insp .steps li.cur .mk::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--hc); }
.pj-insp .steps li.cur:not(.still):not(.bad) .mk::before { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px solid var(--hc);
  opacity: 0; animation: pjripple 2.2s cubic-bezier(.2,.6,.3,1) infinite; }
.pj-insp .steps li.bad .mk { border-color: var(--amber); }
.pj-insp .steps li.bad .mk::after { background: var(--amber); }
.pj-insp .primary { background: var(--ink); color: var(--panel); border-radius: 6px; }
.pj-empty { padding: 30px 6px; }
.pj-empty pre { background: var(--soft); padding: 10px 12px; border-radius: 4px; font-size: 12px; }

/* one data category in its own window, grown from the box that was clicked */
.pj-scrim { position: absolute; inset: 0; z-index: 4; background: color-mix(in srgb, var(--bg) 70%, transparent);
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .3s; }
.pj-scrim.on { opacity: 1; pointer-events: auto; }
.pj-win { position: absolute; inset: 16px; z-index: 5; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 50px -20px rgba(0,0,0,.35); }
.pj-win[hidden] { display: none; }
.pw-head { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--line); }
.pw-head .crumb { all: unset; cursor: pointer; color: var(--muted); }
.pw-head .crumb:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.pw-head .sep { color: var(--faint); }
.pw-head b { font-size: 16px; font-weight: 500; }
.pw-head .meta { font-size: 13px; color: var(--muted); }
.pw-body { display: grid; grid-template-columns: minmax(0, 1fr) 270px; min-height: 0; }
.pw-body svg { display: block; width: 100%; height: 100%; }
.pw-body .pj-insp.in-win { border-left: 1px solid var(--line); }
.pw-body.one { grid-template-columns: minmax(0, 1fr); }
.pj-insp .primary.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); margin-top: 14px; padding: 7px 0; }
.pj-insp .q { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink2); }
.pj-insp .concl { margin: 0; padding-left: 10px; border-left: 2px solid var(--ink); font-size: 13px; line-height: 1.6; }
.pj-insp .tag.plain { color: var(--muted); background: var(--soft); cursor: default; }


/* overview: pointing at something lights up its connections */
#proj .pj-map .an, #proj .pj-map .dn { transition: opacity .2s; }
#proj .pj-map .link { transition: opacity .2s, stroke .2s; }
#proj .pj-map .link.guess { stroke-dasharray: 3 3; }
#proj .pj-map.dim .an:not(.hi), #proj .pj-map.dim .dn:not(.hi), #proj .pj-map.dim .slot { opacity: .22; }
#proj .pj-map.dim .link:not(.hi) { opacity: .12; }
#proj .pj-map .link.hi { stroke: var(--ink); stroke-width: 1.5; }
.pj-legend .lg.guess { width: 16px; height: 0; border-radius: 0; border-top: 1.5px dashed var(--muted); vertical-align: 3px; }

/* one analysis as a flow */
#proj .fl-main { display: flex; min-width: 0; min-height: 0; }
#proj .fl-main svg { flex: 1; }
#proj .spine { stroke: var(--line); stroke-width: 2; }
#proj .spine.todo { stroke-dasharray: 3 4; }
#proj .flink { fill: none; stroke: var(--link); stroke-width: 1.2; }
#proj .flink.todo { stroke: var(--line); stroke-dasharray: 3 4; }
#proj .fdata rect { fill: var(--panel); stroke: var(--ink); stroke-width: 1; transition: stroke-width .15s; }
#proj .fdata.raw rect { stroke: var(--dash); stroke-dasharray: 3 3; }
#proj .fdata[data-cat] { cursor: zoom-in; }
#proj .fdata[data-cat]:hover rect { stroke-width: 2; }
#proj .fstep .node { fill: var(--panel); stroke: var(--dash); stroke-width: 1.5; }
#proj .fstep.left .node { stroke-dasharray: 2 2; }
#proj .fstep.bad .node { fill: var(--amber); stroke: var(--amber); }
#proj .node.end.todo { fill: var(--panel); stroke: var(--dash); stroke-dasharray: 2 2; }
#proj .spin { fill: none; stroke-width: 2; stroke-linecap: round; transform-box: view-box; animation: pjspin 1.4s linear infinite; }
#proj .t-big { font-size: 22px; font-weight: 500; fill: var(--ink); font-variant-numeric: tabular-nums; }
#proj .t-node.strong { font-weight: 600; }
#proj .t-node.t-faint { fill: var(--faint); }
#proj .t-v { font-size: 11px; fill: var(--muted); }
#proj .t-new { font-size: 10.5px; font-weight: 600; fill: var(--ink); }
#proj .sheet { fill: var(--panel); stroke: var(--dash); }
#proj .sheet.front { stroke: var(--ink); }
#proj .fi { fill: none; stroke: var(--muted); stroke-width: 1; }
#proj .ffile.fresh .t-sub { fill: var(--ink); }
#proj .ffile.fresh { animation: pjslide .7s cubic-bezier(.2,.8,.2,1) both; }
#proj .fcheck circle { fill: var(--panel); stroke: var(--muted); stroke-width: 1.5; }
#proj .fcheck path { fill: none; stroke: var(--panel); stroke-width: 1.6; stroke-linecap: round; }
#proj .fcheck.ok circle { fill: var(--ink); stroke: var(--ink); }
#proj .fcheck.no circle { fill: var(--blocked); stroke: var(--blocked); }
#proj .fcheck.hold circle { stroke: var(--amber); }
#proj .fcheck.hold path { fill: var(--amber); stroke: none; }
#proj .fcheck.open circle { stroke-dasharray: 2 2.4; }
/* entrance: data, then the steps one by one, then what they made, then each verdict lands */
#proj .fl-main.enter .fstep, #proj .fl-main.enter .ffile { opacity: 0; animation: pjreveal .45s ease-out forwards; }
#proj .fl-main.enter .fcheck { opacity: 0; transform-box: fill-box; transform-origin: 16px 50%; animation: pjland .55s cubic-bezier(.2,.8,.2,1.25) forwards; }
#proj .fl-main.enter .tick.late { stroke-dasharray: 12; stroke-dashoffset: 12; animation: pjtick .35s ease-out forwards; }
@keyframes pjslide { from { opacity: 0; transform: translateX(-12px); } }
@keyframes pjland { from { opacity: 0; transform: translateX(-8px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes pjtick { to { stroke-dashoffset: 0; } }
.pw-head .meta.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px;
  background: var(--now); animation: pjbreathe 1.8s ease-in-out infinite; vertical-align: 1px; }
.pj-insp.in-win .q { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--ink2); }
.pj-insp.in-win .concl { margin: 0; padding-left: 10px; border-left: 2px solid var(--ink); font-size: 13.5px; line-height: 1.6; }
.pj-insp .vlist { list-style: none; margin: 0; padding: 0; }
.pj-insp .vlist li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 12.5px; line-height: 1.5; }
.pj-insp .vlist b { font-weight: 600; font-size: 12px; }
.pj-insp .vlist li.ok b { color: var(--ink); } .pj-insp .vlist li.no b { color: var(--blocked); }
.pj-insp .vlist li.open b { color: var(--muted); } .pj-insp .vlist li.hold b { color: var(--amber); }
.pj-insp .path + .path { margin-top: 4px; }

/* questions and to-dos */
#todo { flex: 1; min-height: 0; overflow-y: auto; background: var(--bg); }
.td-page { max-width: 1240px; margin: 0 auto; padding: 28px 28px 80px; }
.td-top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-bottom: 26px; }
.td-title { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.td-title h1 { margin: 0; font-size: 24px; font-weight: 500; letter-spacing: -.015em; }
.td-where { margin: 0; font-size: 12.5px; color: var(--muted); }
.td-where.bad { color: var(--amber); }
.td-cap { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 10px; transition: border-color .2s, box-shadow .2s; }
.td-cap:focus-within { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 8%, transparent); }
.td-cap textarea { all: unset; box-sizing: border-box; display: block; width: 100%; min-height: 52px; font-size: 14px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; resize: vertical; }
.td-cap textarea::placeholder { color: var(--faint); }
.td-capbar { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.td-note { flex: 1; font-size: 12.5px; color: var(--muted); }
.td-note.bad { color: var(--amber); }
.td-hint { font-size: 11.5px; color: var(--faint); }
.td-cap button { all: unset; cursor: pointer; font-size: 13px; padding: 6px 14px; border-radius: 6px; background: var(--ink); color: var(--panel); }
.td-cap button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.td-cap.busy button { opacity: .5; pointer-events: none; }
.td-cap.busy::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--ink), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: tdscan 1.3s ease-in-out infinite; }
@keyframes tdscan { from { background-position: -40% 0; } to { background-position: 140% 0; } }
.td-tools { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-size: 13px; }
.td-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.td-seg button { all: unset; cursor: pointer; padding: 4px 12px; color: var(--muted); }
.td-seg button + button { border-left: 1px solid var(--line); }
.td-seg button.on { background: var(--ink); color: var(--panel); }
.td-toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--ink2); }
.td-toggle input { position: absolute; opacity: 0; }
.td-toggle span { width: 30px; height: 17px; border-radius: 9px; background: var(--line); position: relative; transition: background .2s; }
.td-toggle span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--panel); transition: transform .2s var(--ease); }
.td-toggle input:checked + span { background: var(--ink); }
.td-toggle input:checked + span::after { transform: translateX(13px); }
.td-toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.td-find { margin-left: auto; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; width: 220px; border-radius: 7px;
  box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); transition: box-shadow .15s; }
.td-find:focus-within { box-shadow: inset 0 0 0 1px var(--ink), 0 0 0 3px color-mix(in srgb, var(--ink) 8%, transparent); }
.td-find svg { width: 14px; height: 14px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; }
.td-find input { all: unset; flex: 1; min-width: 0; font-size: 13px; color: var(--ink); }
.td-find input::placeholder { color: var(--faint); }
/* questions are amber, to-dos blue, everywhere on this page: the marker, the bars, the legend */
#todo { --tq: var(--derive); --tt: var(--accent); --td: var(--link); }
.td-split { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 40px; align-items: start; }
.td-index { position: sticky; top: 18px; max-height: calc(100vh - 150px); overflow: hidden auto; scrollbar-width: thin; scrollbar-gutter: stable;
  padding: 2px 6px 12px 0; display: grid; align-content: start; gap: 2px; }
.td-ih { margin: 18px 10px 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
.td-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0 0 12px; font-size: 12px; color: var(--muted); }
.td-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: -0.5px; }
.td-legend .hit { flex-basis: 100%; color: var(--ink2); }
i.q { background: var(--tq); } i.t { background: var(--tt); } i.d { background: var(--td); }
.td-ip { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 10px;
  padding: 9px 10px 10px; border-radius: 7px; transition: background .15s; }
.td-ip .nm { font-size: 14px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.td-ip b { font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.td-ip:hover { background: var(--soft); }
.td-ip.on { background: var(--soft); }
.td-ip.on .nm { color: var(--ink); font-weight: 600; }
.td-ip.inbox .nm { color: var(--amber); }
.td-ip:focus-visible, .td-it button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.td-bar { grid-column: 1 / -1; display: flex; gap: 2px; height: 4px; margin-top: 6px; border-radius: 2px; overflow: hidden; }
.td-bar i { min-width: 0; transition: flex-grow .5s var(--ease); }
.td-bar i.q { background: var(--tq); } .td-bar i.t { background: var(--tt); } .td-bar i.d { background: var(--td); opacity: .6; }
.td-it { display: grid; }
.td-it button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: baseline; gap: 8px; padding: 4px 8px; border-radius: 5px;
  font-size: 12.5px; color: var(--muted); }
.td-it button span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.td-it button b { font-weight: 500; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.td-it button:hover { color: var(--ink); background: var(--soft); }
@media (max-width: 760px) {
  .td-split { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .td-index { position: static; max-height: none; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
  .td-legend, .td-it, .td-ih { display: none; }
  .td-ip { min-width: 150px; box-shadow: inset 0 0 0 1px var(--line); }
  .td-find { width: 100%; margin-left: 0; }
}
.td-grid { min-width: 0; max-width: 780px; }
.td-proj { margin: 0 0 28px; padding: 0; }
.td-proj h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 6px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); font-size: 21px; font-weight: 500; letter-spacing: -.01em; }
.td-proj h2 span { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--muted); }
.td-proj.inbox h2 { border-bottom-color: var(--amber); }
.td-proj.quiet h2 { border-bottom-color: var(--line); color: var(--muted); }
.td-empty { font-size: 12.5px; color: var(--faint); margin: 0; }
.td-theme { margin: 0 0 22px; scroll-margin-top: 12px; border-radius: 8px; }
.td-theme.flash { animation: tdflash 1.4s var(--ease); }
@keyframes tdflash { 0%, 30% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 16%, transparent); background: color-mix(in srgb, var(--accent) 6%, transparent); } }
.td-moreit { all: unset; cursor: pointer; display: block; margin: 4px 0 0 30px; padding: 3px 0; font-size: 12.5px; color: var(--muted); }
.td-moreit:hover { color: var(--ink); }
.td-moreit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.td-sugb { all: unset; cursor: pointer; font-size: 11.5px; color: var(--faint); padding: 0 6px; border-radius: 3px; outline: 1px dashed var(--dash); outline-offset: -1px; }
.td-sugb:hover { color: var(--ink); outline-color: var(--ink); }
.td-theme h3 { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 2px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.td-theme h3 small { font-weight: 400; color: var(--faint); }
.td-theme h3 b { font-weight: 500; color: var(--faint); font-size: 11.5px; }
.td-theme ul { list-style: none; margin: 0; padding: 0; }
.td-item { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 9px 0 10px; border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.td-item.fresh { animation: tdfresh 1.6s var(--ease); }
@keyframes tdfresh { 0% { opacity: 0; transform: translateY(-6px); background: color-mix(in srgb, var(--ink) 8%, transparent); }
  30% { opacity: 1; transform: none; } 100% { background: transparent; } }
.td-check { all: unset; cursor: pointer; width: 18px; height: 18px; margin-top: 2px; }
.td-check svg { width: 18px; height: 18px; display: block; }
.td-check circle { fill: none; stroke: var(--dash); stroke-width: 1.4; transition: fill .2s, stroke .2s; }
.td-check circle { stroke: color-mix(in srgb, var(--tt) 70%, var(--dash)); }
.td-item.question .td-check circle { stroke-dasharray: 3 2.2; stroke: var(--tq); }
.td-check path { fill: none; stroke: var(--panel); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 12; stroke-dashoffset: 12; transition: stroke-dashoffset .3s .1s; }
.td-check:hover circle { stroke: var(--ink); }
.td-check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 50%; }
.td-item.done .td-check circle, .td-item.checking .td-check circle { fill: var(--ink); stroke: var(--ink); stroke-dasharray: none; }
.td-item.done .td-check path, .td-item.checking .td-check path { stroke-dashoffset: 0; }
.td-text { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink); outline: none;
  background: linear-gradient(var(--muted), var(--muted)) no-repeat 0 55% / 0 1px; transition: background-size .45s var(--ease), color .3s; }
.td-text[contenteditable] { background: var(--soft); border-radius: 3px; padding: 0 4px; margin: 0 -4px; }
.td-item.done .td-text, .td-item.checking .td-text { color: var(--muted); background-size: 100% 1px; }
.td-item.checking { animation: tdleave .35s .5s ease-in forwards; }
@keyframes tdleave { to { opacity: 0; transform: translateX(8px); } }
.td-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; font-size: 11.5px; color: var(--faint); }
.td-meta .td-src { box-shadow: none; padding: 0; color: var(--faint); }
.td-meta a.td-src:hover { box-shadow: none; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.td-kind { font-size: 11px; padding: 0 6px; border-radius: 3px; background: var(--soft); color: var(--ink2); }
.td-item.question .td-kind { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.td-id { color: var(--faint); }
.td-ev { all: unset; cursor: pointer; font-size: 11.5px; color: var(--now); padding: 0 6px; border-radius: 3px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--now) 45%, var(--line));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.td-ev:hover { background: color-mix(in srgb, var(--now) 10%, transparent); }
.td-review { all: unset; cursor: pointer; font-size: 12.5px; padding: 3px 10px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink2); }
.td-review:hover { box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); }
.td-review:disabled { opacity: .5; cursor: default; }
.td-src { color: var(--ink2); text-decoration: none; padding: 0 6px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
a.td-src:hover { box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); }
.td-more { all: unset; cursor: pointer; margin-left: auto; color: var(--faint); opacity: 0; transition: opacity .15s; }
.td-item:hover .td-more, .td-more:focus-visible { opacity: 1; }
.td-more:hover { color: var(--ink); }
.td-edit { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.td-edit select, .td-edit input { font: inherit; font-size: 12.5px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink); }
.td-edit input { flex: 1; min-width: 120px; }
.td-edit button { all: unset; cursor: pointer; font-size: 12.5px; padding: 4px 10px; border-radius: 5px; background: var(--ink); color: var(--panel); }
.td-edit button.danger { background: transparent; color: var(--blocked); box-shadow: inset 0 0 0 1px var(--line); }
.td-links { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 7px; }
.td-sl { font-size: 11px; color: var(--faint); }
.td-an { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 2px 4px 2px 8px; border-radius: 5px; font-size: 12px;
  box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); }
.td-an.sug { box-shadow: none; outline: 1px dashed var(--dash); outline-offset: -1px; background: transparent; }
.td-an i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.td-an time { color: var(--faint); font-size: 11px; }
.td-an button { all: unset; cursor: pointer; }
.td-open { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.td-open:hover { text-decoration: underline; text-underline-offset: 3px; }
.td-yes { font-size: 11px; padding: 0 6px; border-radius: 3px; background: var(--ink); color: var(--panel); }
.td-no { color: var(--faint); padding: 0 4px; font-size: 14px; line-height: 1; }
.td-no:hover { color: var(--ink); }
.td-item.ro { grid-template-columns: 52px minmax(0, 1fr); }
.td-item.ro.np { grid-template-columns: minmax(0, 1fr); padding-left: 30px; }
.td-item.ro .td-text { font-size: 13px; color: var(--ink2); }
.td-pri { font-size: 10.5px; text-align: center; padding: 1px 0; border-radius: 3px; height: fit-content; margin-top: 2px; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.td-pri.high { background: var(--ink); color: var(--panel); box-shadow: none; }
.td-pri.low { color: var(--faint); }
.td-theme.backlog h3 { color: var(--muted); }
.td-theme.qlog h3 { color: var(--ink2); }
.td-item.ql { grid-template-columns: 44px minmax(0, 1fr); }
.td-qid { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.td-vd { font-size: 11px; padding: 0 6px; border-radius: 3px; background: var(--soft); color: var(--muted); }
.td-vd.ok { background: var(--ink); color: var(--panel); }
.td-vd.no { background: color-mix(in srgb, var(--blocked) 16%, transparent); color: var(--blocked); }
.td-vd.hold { color: var(--amber); }
.td-flip { font-size: 11px; color: var(--amber); }
.td-stale { font-size: 11px; color: var(--amber); }
.td-item.ql.done .td-text { color: var(--muted); }
html.calm #todo *, html.calm #todo *::before, html.calm #todo *::after { animation: none !important; transition: none !important; }

/* project view, rebuilt: a project → session → task tree on a dot grid, and a data catalog */
:root { --m-dna: #2a78d6; --m-rna: #eb6834; --m-protein: #1baf7a; --m-spatial: #eda100; --m-single: #e87ba4; --m-clinical: #008300;
  --m-cohort: #6250d6; --m-ref: #e34948; --m-etc: #9A9EA5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --m-dna: #3987e5; --m-rna: #d95926; --m-protein: #199e70; --m-spatial: #c98500;
  --m-single: #d55181; --m-clinical: #2f9a2f; --m-cohort: #9085e9; --m-ref: #e66767; --m-etc: #6E727A; } }
:root[data-theme="dark"] { --m-dna: #3987e5; --m-rna: #d95926; --m-protein: #199e70; --m-spatial: #c98500; --m-single: #d55181;
  --m-clinical: #2f9a2f; --m-cohort: #9085e9; --m-ref: #e66767; --m-etc: #6E727A; }
#proj .m-dna { --mc: var(--m-dna); } #proj .m-rna { --mc: var(--m-rna); } #proj .m-protein { --mc: var(--m-protein); } #proj .m-spatial { --mc: var(--m-spatial); }
#proj .m-single { --mc: var(--m-single); } #proj .m-clinical { --mc: var(--m-clinical); } #proj .m-cohort { --mc: var(--m-cohort); } #proj .m-ref { --mc: var(--m-ref); } #proj .m-etc { --mc: var(--m-etc); }

.pj-stage { grid-template-rows: auto minmax(0, 1fr); }
.pj-head { align-items: center; padding: 16px 24px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.pj-tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.pj-tabs[hidden] { display: none; }
.pj-tabs button { all: unset; cursor: pointer; font-size: 13px; padding: 5px 14px; color: var(--muted); }
.pj-tabs button + button { border-left: 1px solid var(--line); }
.pj-tabs button[aria-selected="true"] { background: var(--ink); color: var(--panel); }
.pj-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pj-head .pj-legend { position: static; margin-left: auto; display: flex; gap: 16px; font-size: 12px; color: var(--muted); pointer-events: none; }
.pj-head .pj-legend .lg { display: inline-block; width: 18px; height: 0; border-radius: 0; margin-right: 6px; vertical-align: 3px; border-top: 2px solid var(--line); }
.pj-head .pj-legend .lg.run { border-top: 2px dashed var(--now); }
.pj-head .pj-legend .lg.wait { border-top: 2px dashed var(--amber); }
.pj-head .pj-legend .lg.done { border-top-color: color-mix(in srgb, var(--ink) 35%, var(--line)); }
.pj-head .pj-legend .lg.left { border-top: 2px dotted var(--dash); }
.pj-scans { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
.pj-scans .scan.bad { color: var(--amber); }
.pj-tree { overflow: auto; min-height: 0; background-color: var(--bg); background-image: radial-gradient(color-mix(in srgb, var(--ink) 14%, transparent) 1px, transparent 1px);
  background-size: 18px 18px; }
.pj-tree[hidden], .pj-cat[hidden] { display: none; }
.pj-svg { display: block; }
.pj-svg .col { animation: pjcol .5s var(--ease) both; }
.pj-svg .edges.enter { animation: pjreveal .6s .25s ease-out both; opacity: 0; }
@keyframes pjcol { from { opacity: 0; transform: translateX(-8px); } }
@keyframes pjmarch { to { stroke-dashoffset: -11; } }

#proj .nd { cursor: pointer; outline: none; }
#proj .nd .box { fill: var(--panel); stroke: var(--line); stroke-width: 1; transition: stroke .15s; }
#proj .nd:hover .box, #proj .nd:focus-visible .box { stroke: color-mix(in srgb, var(--ink) 60%, var(--line)); }
#proj .nd.sel .box { stroke: var(--ink); stroke-width: 1.6; }
/* right-click menu on the map: a small sheet that grows out of the pointer */
#proj .nd.menu-on .box { stroke: var(--accent); stroke-width: 1.6; }
#proj .nd.hid { opacity: .42; }
#proj .nd.hid .box { stroke-dasharray: 4 3; }
#proj .nd.saving .box { stroke: var(--now); stroke-dasharray: 5 4; animation: pjmarch .7s linear infinite; }
.pj-menu { position: fixed; z-index: 60; min-width: 216px; max-width: 300px; padding: 5px; border-radius: 8px;
  background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 12%, transparent), 0 12px 32px -8px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.12); }
.pj-menu[hidden] { display: none; }
.pj-menu.in { animation: pjmenu .17s var(--ease); }
@keyframes pjmenu { from { opacity: 0; transform: scale(.94) translateY(-3px); } }
.pj-menu .mh { padding: 6px 9px 7px; margin-bottom: 3px; border-bottom: 1px solid var(--line); display: grid; gap: 1px; }
.pj-menu .mh b { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.pj-menu .mh small { font-size: 11px; color: var(--muted); }
.pj-menu button { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 9px; padding: 6px 9px;
  border-radius: 5px; font-size: 12.5px; color: var(--ink); cursor: pointer; transition: background .12s, color .12s; }
.pj-menu button svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: stroke .12s, transform .2s var(--ease); }
.pj-menu button:hover, .pj-menu button:focus-visible { background: color-mix(in srgb, var(--accent) 13%, transparent); }
.pj-menu button:hover svg, .pj-menu button:focus-visible svg { stroke: var(--accent); transform: translateX(1px); }
.pj-menu button.danger { color: var(--blocked); }
.pj-menu button.danger svg { stroke: var(--blocked); }
.pj-menu button.danger:hover, .pj-menu button.danger:focus-visible { background: var(--blocked-bg); }
.pj-menu button:disabled { cursor: default; color: var(--muted); }
.pj-menu button:disabled:hover { background: none; }
.pj-menu button i { margin-left: auto; font-style: normal; font-size: 10.5px; color: var(--accent); padding: 1px 6px; border-radius: 9px;
  background: color-mix(in srgb, var(--accent) 14%, transparent); }
.pj-menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.pj-menu .mi { display: flex; align-items: center; gap: 9px; margin: 2px 0; padding: 4px 6px 4px 9px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--line); }
.pj-menu .mi:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }
.pj-menu .mi svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.pj-menu .mi input { all: unset; flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink); }
.pj-menu .mi input::placeholder { color: var(--faint); }
.pj-menu .mi kbd { font: inherit; font-size: 10.5px; color: var(--faint); }
/* a sub-analysis theme: between the project and its sessions, quieter than a session, lit while one of its sessions runs */
#proj .nd.theme .box { fill: color-mix(in srgb, var(--accent) 7%, var(--panel)); stroke: color-mix(in srgb, var(--accent) 35%, var(--line)); }
#proj .nd.theme .ic { fill: color-mix(in srgb, var(--accent) 16%, var(--panel)); }
#proj .nd.theme .icp { stroke: var(--accent); }
#proj .nd.theme .nt { font-weight: 600; }
#proj .nd.theme.unsorted .box { fill: var(--panel); stroke: var(--line); stroke-dasharray: 4 3; }
#proj .nd.theme.unsorted .icp { stroke: var(--muted); }
#proj .nd.theme.t-run .box { stroke: color-mix(in srgb, var(--now) 60%, var(--line)); }
#proj .nd.theme.t-wait .box { stroke: color-mix(in srgb, var(--amber) 60%, var(--line)); }
/* map search and the closed-sessions switch: top left of the canvas */
.pj-find { position: absolute; top: 12px; left: 12px; z-index: 3; display: flex; gap: 8px; align-items: center; }
.pj-find label { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; width: 220px; border-radius: 7px;
  background: color-mix(in srgb, var(--panel) 90%, transparent); backdrop-filter: blur(8px); box-shadow: inset 0 0 0 1px var(--line); }
.pj-find label:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }
.pj-find svg { width: 14px; height: 14px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; }
.pj-find input { all: unset; flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink); }
.pj-find input::placeholder { color: var(--faint); }
.pj-ended { all: unset; cursor: pointer; height: 30px; padding: 0 11px; border-radius: 7px; font-size: 12.5px; color: var(--muted);
  background: color-mix(in srgb, var(--panel) 90%, transparent); box-shadow: inset 0 0 0 1px var(--line); transition: color .15s, box-shadow .15s, background .15s; }
.pj-ended:hover { color: var(--ink); }
.pj-ended[aria-pressed="true"] { color: var(--ink); background: var(--soft); box-shadow: inset 0 0 0 1px var(--ink2); }
.pj-ended:disabled { opacity: .45; cursor: default; }
.pj-ended:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pj-stage:has(.pj-cat:not([hidden])) .pj-find { display: none; }
.pj-toast { position: fixed; z-index: 61; left: 50%; bottom: 22px; display: flex; align-items: center; gap: 12px; padding: 9px 14px;
  border-radius: 8px; font-size: 12.5px; color: var(--panel); background: var(--ink); box-shadow: 0 10px 28px -8px rgba(0,0,0,.45);
  opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity .2s, transform .3s var(--ease); }
.pj-toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.pj-toast.err { background: var(--blocked); color: #fff; }
.pj-toast button { all: unset; cursor: pointer; font-weight: 600; color: color-mix(in srgb, var(--accent) 70%, var(--panel)); }
.pj-toast button:hover { text-decoration: underline; }
#proj .nd .ic { fill: var(--soft); }
#proj .nd .icp { fill: none; stroke: var(--ink2); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
#proj .nd.project .ic { fill: var(--ink); }
#proj .nd.project .icp { stroke: var(--panel); }
#proj .nd.project .box { stroke: color-mix(in srgb, var(--ink) 40%, var(--line)); }
#proj .nd.s-busy .box { stroke: color-mix(in srgb, var(--now) 60%, var(--line)); }
#proj .nd.s-busy .ic { fill: color-mix(in srgb, var(--now) 16%, var(--panel)); }
#proj .nd.s-busy .icp { stroke: var(--now); }
#proj .nd.s-waiting .box { stroke: color-mix(in srgb, var(--amber) 60%, var(--line)); }
#proj .nd.s-waiting .ic { fill: color-mix(in srgb, var(--amber) 16%, var(--panel)); }
#proj .nd.s-waiting .icp { stroke: var(--amber); }
#proj .nd.s-ended { opacity: .6; }
#proj .nd.s-ended:hover, #proj .nd.s-ended.sel { opacity: 1; }
#proj .nd.group .box { stroke-dasharray: 4 3; }
#proj .nt { font-size: 13px; font-weight: 500; fill: var(--ink); }
#proj .nt.sm { font-size: 12.5px; font-weight: 400; }
#proj .nt, #proj .ns { text-anchor: start; stroke: none; paint-order: normal; }
#proj .ns { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
#proj .ns.end { text-anchor: end; }
#proj .pbar { fill: var(--soft); }
#proj .pfill { fill: var(--ink); opacity: .55; transition: width .6s var(--ease); }
#proj .s-busy .pfill { fill: var(--now); opacity: 1; }
#proj .chev rect { fill: transparent; }
#proj .chev:hover rect { fill: var(--soft); }
#proj .chev path { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
#proj .badge rect { fill: var(--now); }
#proj .badge.wait rect { fill: var(--amber); }
#proj .badge text { font-size: 10.5px; font-weight: 600; fill: #fff; }
#proj .edge { fill: none; stroke: var(--line); stroke-width: 1.3; }
#proj .edge.done { stroke: color-mix(in srgb, var(--ink) 32%, var(--line)); }
#proj .edge.idle, #proj .edge.now { stroke: color-mix(in srgb, var(--ink) 50%, var(--line)); }
#proj .edge.left, #proj .edge.ended { stroke: var(--dash); stroke-dasharray: 2 4; }
#proj .edge.guess { stroke: var(--dash); stroke-dasharray: 3 3; }
#proj .edge.run { stroke: var(--now); stroke-width: 1.8; stroke-dasharray: 6 5; animation: pjmarch .8s linear infinite; }
#proj .edge.wait { stroke: var(--amber); stroke-width: 1.7; stroke-dasharray: 6 5; animation: pjbreathe 2.4s ease-in-out infinite; }
#proj .edge.ah { stroke-dasharray: none; animation: none; stroke-linecap: round; stroke-linejoin: round; }
#proj .task .box { fill: var(--panel); }
#proj .task.t-run .box { stroke: color-mix(in srgb, var(--now) 55%, var(--line)); fill: color-mix(in srgb, var(--now) 5%, var(--panel)); }
#proj .task.t-wait .box { stroke: color-mix(in srgb, var(--amber) 55%, var(--line)); }
#proj .task.t-left .nt, #proj .task.t-more .nt { fill: var(--muted); }
#proj .task.t-left .box { stroke-dasharray: 3 3; }
#proj .sm-dot { fill: color-mix(in srgb, var(--ink) 70%, var(--panel)); }
#proj .sm-tick { fill: none; stroke: var(--panel); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#proj .sm-tick.stamp { stroke-dasharray: 10; stroke-dashoffset: 10; animation: pjtick .4s .15s ease-out forwards; }
#proj .sm-ring { fill: none; stroke: color-mix(in srgb, var(--now) 28%, var(--panel)); stroke-width: 2; }
#proj .sm-ring.now { stroke: color-mix(in srgb, var(--ink) 40%, var(--panel)); }
#proj .sm-core { fill: var(--ink2); }
#proj .sm-spin { fill: none; stroke: var(--now); stroke-width: 2; stroke-linecap: round; transform-box: view-box; animation: pjspin 1.1s linear infinite; }
#proj .sm-wait { fill: var(--amber); }
#proj .sm-bang { stroke: var(--panel); stroke-width: 1.8; stroke-linecap: round; }
#proj .sm-left { fill: none; stroke: var(--dash); stroke-width: 1.3; stroke-dasharray: 2 2.2; }
#proj .sm-more { stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
#proj .nd.data .box { fill: var(--panel); }
#proj .nd.data .icp { stroke: var(--ink2); }
#proj .nd.data.raw .box { stroke-dasharray: 3 3; }
#proj .nd.report .ic { fill: var(--soft); }
#proj .lineage { display: block; margin: 4px 0 6px; overflow: visible; }

.pj-p .live { gap: 10px; }
#proj .pj-p .dot, #proj .ilist .dot, #proj .dc-an .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-right: 5px; flex: none; }
#proj .dot.run, #proj .dot.busy { background: var(--now); box-shadow: 0 0 0 3px color-mix(in srgb, var(--now) 20%, transparent); animation: pjbreathe 2s ease-in-out infinite; }
