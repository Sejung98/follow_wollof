; follow_wollof 설정 파일
; `fw init` 이 이 파일을 config.ini 로 복사합니다. config.ini 만 고치면 됩니다.
; 주석은 ; 또는 # 로 시작합니다.

[dashboard]
; 대시보드 주소: http://localhost:<port>
port = 7777
; 127.0.0.1 이면 이 컴퓨터에서만 열립니다 (권장).
bind = 127.0.0.1

[agent]
; 각 호스트에서 세션 변화를 확인하는 주기 (초)
interval = 2

[ssh]
; 모든 ssh 호스트에 덧붙일 ssh 옵션 (선택). 예: -o ProxyJump=bastion
options =

; ── 호스트 ───────────────────────────────────────────────
; [host:<대시보드에 표시할 이름>] 섹션 하나가 호스트 하나입니다.
;
;   type    = local | ssh
;             local : 대시보드를 띄운 이 컴퓨터
;             ssh   : ssh 로 접속하는 Linux/macOS 서버
;   ssh     = ~/.ssh/config 의 Host 별칭 또는 user@hostname   (type = ssh 일 때 필수)
;             비밀번호 없이 키로 접속돼야 합니다: `ssh <별칭> true` 가 묻지 않고 끝나는지 확인
;   python  = 그 호스트에서 쓸 파이썬 명령 (선택, 기본: ssh 는 python3, local 은 fw 를 실행한 파이썬)
;   deploy  = fw deploy 로 세션 도구를 설치할지 (선택, 기본 true)
;   enabled = false 로 두면 잠시 제외 (선택)

[host:local]
type = local

;[host:lab-server]
;type = ssh
;ssh = lab-server

;[host:gpu-box]
;type = ssh
;ssh = me@gpu-box.example.org
;python = /opt/conda/bin/python3

; ── 프로젝트 (선택) ───────────────────────────────────────────
; [project:<화면에 보일 이름>] 하나가 프로젝트 하나입니다. 섹션 순서가 프로젝트 화면의 순서입니다.
;   <호스트 이름> = 그 호스트에서 이 프로젝트의 폴더 (여러 개는 쉼표로)
;   data         = 데이터 폴더 (선택, 프로젝트 폴더 기준 이름·패턴, 쉼표로. 예: 00_raw_data, 02_data, _cohort)
;                  비우면 data · raw_data · 02_data · _cohort 처럼 생긴 하위 폴더를 찾습니다.
; 세션은 계획을 세운 폴더(없으면 Claude 를 시작한 폴더)가 들어 있는 프로젝트에 묶입니다.
; 데이터 현황(데이터 폴더별 파일 수·크기·형식, daily_analysis 보고서, RESULTS_DIGEST 발견, 백로그)은
; 서버에서 [projects] inventory_minutes 분마다 다시 읽습니다 (기본 15).
;
; [project:유방암 코호트]
; lab-server = /home/me/R_env/01_brca
; local      = C:\work\brca
; data       = 00_raw_data, 02_data

; ── 데스크탑 알림 (선택) ──────────────────────────────────────
; 세션이 끝나거나(ended), 오래 작업한 뒤 멈추거나(stopped), 입력을 기다리거나(waiting),
; 단계가 막히거나(blocked), 2시간째 기록이 없으면(stale) 알림을 띄웁니다. 확인: fw notify
; [notify]
; enabled  = true
; events   = ended, stopped, waiting, blocked, stale
; min_busy = 60      ; 이 초 이상 작업한 뒤 멈출 때만 stopped 알림

; ── 질문·할 일 (선택) ─────────────────────────────────────────
; 회의·공부 중에 생긴 질문과 할 일을 프로젝트·테마별로 모으는 페이지. 목록은 아래 호스트의 파일 하나에 두므로
; 여러 데스크탑이 같은 목록을 봅니다. 완료한 항목도 완료 시각과 함께 남습니다.
; [todo]
; host     = lab-server             ; [host:<이름>] 중 하나
; path     = ~/.follow_wollof/todo.json
; classify = claude                 ; 메모를 항목으로 나누고 프로젝트·테마를 고를 때 이 컴퓨터의 Claude Code 사용 (off: 줄마다 한 항목)
; model    = haiku                  ; 분류에 쓸 모델 (한 번에 약 0.1센트)
; claude   =                        ; claude 명령 경로 (비우면 찾음)
; judge_model = sonnet              ; 회의록에서 가져온 항목이 분석 보고서로 처리됐는지 판정할 모델
; import   = on                     ; off: 회의록·코멘트 메모에서 새 항목을 가져오지 않음
